<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Check-In Misa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #202124;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  background: #17365d;
  color: white;
  padding: 22px 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  text-align: center;
}

.header h1 {
  margin: 0 0 6px;
  font-size: 24px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d7de;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.btn-primary {
  background: #17365d;
  color: white;
}

.btn-danger {
  background: #c62828;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 15px;
  background: #111;
  min-height: 10px;
}

.status {
  padding: 14px;
  border-radius: 12px;
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  word-break: break-word;
}

.status.info {
  display: block;
  background: #e8f1fb;
  color: #17365d;
}

.status.success {
  display: block;
  background: #e8f5e9;
  color: #1b5e20;
}

.status.error {
  display: block;
  background: #ffebee;
  color: #b71c1c;
}

.status.warning {
  display: block;
  background: #fff8e1;
  color: #8d6e00;
}

.result {
  display: none;
}

.result h2 {
  margin-top: 0;
}

.data-row {
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.label-small {
  color: #777;
  font-size: 12px;
}

.value {
  font-weight: bold;
  margin-top: 3px;
}

.hidden {
  display: none !important;
}

.loading {
  text-align: center;
  padding: 15px;
  display: none;
  font-weight: bold;
}

.qr-debug {
  margin-top: 10px;
  padding: 10px;
  background: #f1f3f4;
  border-radius: 10px;
  font-size: 12px;
  word-break: break-all;
}

</style>

</head>


<body>

<div class="container">

  <div class="header">

    <h1>📷 Check-In Misa</h1>

    <p>Scan QR Code tiket umat</p>

  </div>


  <!-- PETUGAS -->

  <div
    class="card"
    id="petugasCard"
  >

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      type="text"
      id="petugas"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >

    <button
      type="button"
      class="btn-primary"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>

    <div
      id="statusAwal"
      class="status"
    ></div>

  </div>


  <!-- SCANNER -->

  <div
    class="card hidden"
    id="scannerCard"
  >

    <h3 style="margin-top:0;">
      Arahkan kamera ke QR tiket
    </h3>

    <div id="reader"></div>

    <div
      id="scannerStatus"
      class="status info"
    >
      Membuka kamera...
    </div>

    <div
      id="qrDebug"
      class="qr-debug"
      style="display:none"
    ></div>

    <button
      type="button"
      class="btn-danger"
      onclick="stopScanner()"
    >
      ✕ Tutup Kamera
    </button>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >
    ⏳ Memproses check-in...
  </div>


  <!-- RESULT -->

  <div
    class="card result"
    id="resultCard"
  >

    <h2 id="resultTitle"></h2>

    <div
      id="resultStatus"
      class="status"
    ></div>

    <div id="resultData"></div>

    <button
      type="button"
      class="btn-primary"
      onclick="scanBerikutnya()"
    >
      📷 Scan Tiket Berikutnya
    </button>

  </div>

</div>


<script>


/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


/* =====================================================
   VARIABLE
===================================================== */

let html5QrCode = null;

let scannerAktif = false;

let sedangMemproses = false;

let jsonpScript = null;

let jsonpTimer = null;


/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner() {

  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  if (!petugas) {

    tampilStatus(
      "statusAwal",
      "Masukkan nama petugas terlebih dahulu.",
      "warning"
    );

    return;
  }


  if (sedangMemproses) {
    return;
  }


  try {

    tampilStatus(
      "statusAwal",
      "Membuka kamera...",
      "info"
    );


    /*
      PENTING:

      Jangan menggunakan getUserMedia()
      di sini.

      Kamera langsung dikelola oleh Html5Qrcode.
    */

    await stopScanner();


    /*
      Beri waktu kepada browser untuk benar-benar
      melepas kamera sebelumnya.
    */

    await tunggu(500);


    document
      .getElementById("petugasCard")
      .classList
      .add("hidden");


    document
      .getElementById("scannerCard")
      .classList
      .remove("hidden");


    /*
      Bersihkan reader sebelum membuat
      instance Html5Qrcode baru.
    */

    document
      .getElementById("reader")
      .innerHTML = "";


    html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox:
        function(
          width,
          height
        ) {

          const min =
            Math.min(
              width,
              height
            );


          const size =
            Math.floor(
              min * 0.70
            );


          return {
            width: size,
            height: size
          };

        },

      aspectRatio: 1.0

    };


    /*
      Gunakan kamera belakang.
    */

    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerAktif = true;


    tampilStatus(
      "scannerStatus",
      "Kamera aktif. Arahkan QR ke kamera.",
      "info"
    );

  }

  catch (error) {

    console.error(
      "GAGAL MEMBUKA KAMERA:",
      error
    );


    document
      .getElementById("scannerCard")
      .classList
      .add("hidden");


    document
      .getElementById("petugasCard")
      .classList
      .remove("hidden");


    let pesan =
      "Kamera tidak dapat digunakan.";


    if (
      error &&
      error.message
    ) {

      pesan +=
        " " +
        error.message;

    }


    tampilStatus(
      "statusAwal",
      pesan,
      "error"
    );

  }

}


/* =====================================================
   TUNGGU
===================================================== */

function tunggu(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/* =====================================================
   QR TERBACA
===================================================== */

async function onScanSuccess(
  decodedText
) {

  if (sedangMemproses) {
    return;
  }


  sedangMemproses = true;


  const idRegistrasi =
    String(
      decodedText || ""
    ).trim();


  console.log(
    "QR TERBACA:",
    idRegistrasi
  );


  const debug =
    document.getElementById(
      "qrDebug"
    );


  debug.style.display =
    "block";


  debug.innerHTML =
    "<b>QR TERBACA:</b><br>" +
    escapeHTML(
      idRegistrasi
    );


  /*
    Hentikan kamera sebelum
    memproses check-in.
  */

  await stopScanner();


  document
    .getElementById("scannerCard")
    .classList
    .add("hidden");


  document
    .getElementById("loading")
    .style
    .display = "block";


  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  panggilAPI(
    idRegistrasi,
    petugas
  );

}


/* =====================================================
   JSONP API
===================================================== */

function panggilAPI(
  idRegistrasi,
  petugas
) {

  bersihkanJSONP();


  const callbackName =
    "misaCheckIn_" +
    Date.now();


  window[callbackName] =
    function(result) {

      console.log(
        "RESPON API:",
        result
      );


      bersihkanJSONP();


      document
        .getElementById("loading")
        .style
        .display = "none";


      tampilHasil(
        result
      );


      sedangMemproses = false;

    };


  const url =
    API_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(
      idRegistrasi
    ) +
    "&petugas=" +
    encodeURIComponent(
      petugas
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  console.log(
    "MEMANGGIL API:",
    url
  );


  jsonpScript =
    document.createElement(
      "script"
    );


  jsonpScript.src =
    url;


  jsonpScript.async =
    true;


  jsonpScript.onerror =
    function() {

      const pesan =
        "Browser gagal memuat API check-in.";


      console.error(
        pesan,
        url
      );


      bersihkanJSONP();


      document
        .getElementById("loading")
        .style
        .display = "none";


      tampilHasil({

        success: false,

        alreadyCheckedIn: false,

        message:
          pesan

      });


      debugTampilkanURL(url);


      sedangMemproses = false;

    };


  document
    .head
    .appendChild(
      jsonpScript
    );


  jsonpTimer =
    setTimeout(
      function() {

        console.error(
          "TIMEOUT API:",
          url
        );


        bersihkanJSONP();


        document
          .getElementById("loading")
          .style
          .display = "none";


        tampilHasil({

          success: false,

          alreadyCheckedIn: false,

          message:
            "API check-in tidak memberikan respons."

        });


        debugTampilkanURL(url);


        sedangMemproses = false;

      },
      15000
    );

}


/* =====================================================
   TAMPIL URL DEBUG
===================================================== */

function debugTampilkanURL(
  url
) {

  const debug =
    document.getElementById(
      "qrDebug"
    );


  debug.style.display =
    "block";


  debug.innerHTML =
    "<b>URL API:</b><br>" +
    escapeHTML(url);

}


/* =====================================================
   BERSIHKAN JSONP
===================================================== */

function bersihkanJSONP() {

  if (jsonpTimer) {

    clearTimeout(
      jsonpTimer
    );

    jsonpTimer = null;

  }


  if (jsonpScript) {

    try {

      jsonpScript.remove();

    }

    catch (e) {}

    jsonpScript = null;

  }

}


/* =====================================================
   SCAN GAGAL
===================================================== */

function onScanFailure() {

  /*
    Tidak perlu melakukan apa-apa.

    Scanner tetap berjalan sampai
    QR berhasil terbaca.
  */

}


/* =====================================================
   STOP CAMERA
===================================================== */

async function stopScanner() {

  const scanner =
    html5QrCode;


  /*
    Set null terlebih dahulu supaya
    tidak ada pemanggilan ulang terhadap
    scanner yang sama.
  */

  html5QrCode = null;


  if (scanner) {

    try {

      await scanner.stop();

    }

    catch (error) {

      console.log(
        "stop:",
        error
      );

    }


    try {

      scanner.clear();

    }

    catch (error) {}

  }


  scannerAktif = false;


  const reader =
    document.getElementById(
      "reader"
    );


  if (reader) {

    reader.innerHTML = "";

  }

}


/* =====================================================
   TAMPIL HASIL
===================================================== */

function tampilHasil(
  result
) {

  document
    .getElementById("resultCard")
    .style
    .display = "block";


  const title =
    document.getElementById(
      "resultTitle"
    );


  const data =
    document.getElementById(
      "resultData"
    );


  data.innerHTML = "";


  if (
    !result ||
    !result.success
  ) {

    if (
      result &&
      result.alreadyCheckedIn
    ) {

      title.textContent =
        "⚠️ Sudah Check-In";


      tampilStatus(
        "resultStatus",

        result.message ||
        "Tiket sudah digunakan.",

        "warning"
      );

    }

    else {

      title.textContent =
        "❌ Check-In Ditolak";


      tampilStatus(
        "resultStatus",

        result &&
        result.message
          ? result.message
          : "Tiket tidak dapat digunakan.",

        "error"
      );

    }

    return;
  }


  title.textContent =
    "✅ Check-In Berhasil";


  tampilStatus(
    "resultStatus",

    result.message ||
    "Tiket berhasil digunakan.",

    "success"
  );


  tambahData(
    "Nama",
    result.nama
  );


  tambahData(
    "Misa",
    result.namaMisa
  );


  tambahData(
    "Tanggal",
    result.tanggal
  );


  tambahData(
    "Jam",
    result.jam
  );


  tambahData(
    "Jumlah",
    result.jumlah + " umat"
  );


  tambahData(
    "Waktu Check-In",
    result.waktuCheckIn
  );

}


/* =====================================================
   DATA
===================================================== */

function tambahData(
  label,
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return;

  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "data-row";


  div.innerHTML =
    '<div class="label-small">' +
    escapeHTML(label) +
    '</div>' +

    '<div class="value">' +
    escapeHTML(
      String(value)
    ) +
    '</div>';


  document
    .getElementById(
      "resultData"
    )
    .appendChild(div);

}


/* =====================================================
   SCAN BERIKUTNYA
===================================================== */

async function scanBerikutnya() {

  /*
    Jangan izinkan membuka scanner
    kalau proses sebelumnya belum selesai.
  */

  if (sedangMemproses) {
    return;
  }


  document
    .getElementById("resultCard")
    .style
    .display = "none";


  document
    .getElementById("loading")
    .style
    .display = "none";


  document
    .getElementById("qrDebug")
    .style
    .display = "none";


  document
    .getElementById("resultData")
    .innerHTML = "";


  /*
    Pastikan kamera lama sudah benar-benar
    dilepas terlebih dahulu.
  */

  await stopScanner();


  /*
    Jeda supaya browser HP selesai
    me-release kamera.
  */

  await tunggu(500);


  /*
    Baru buka kamera lagi.
  */

  mulaiScanner();

}


/* =====================================================
   STATUS
===================================================== */

function tampilStatus(
  id,
  message,
  type
) {

  const el =
    document.getElementById(id);


  if (!el) {
    return;
  }


  el.className =
    "status";


  if (!message) {

    el.style.display =
      "none";

    el.innerHTML =
      "";

    return;

  }


  el.classList.add(
    type
  );


  el.style.display =
    "block";


  el.innerHTML =
    escapeHTML(
      message
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
  "load",
  function() {

    if (!window.isSecureContext) {

      tampilStatus(
        "statusAwal",

        "Halaman scanner harus dibuka melalui HTTPS.",

        "error"
      );

      return;
    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      tampilStatus(
        "statusAwal",

        "Browser ini tidak mendukung akses kamera.",

        "error"
      );

      return;
    }


    tampilStatus(
      "statusAwal",

      "Kamera siap. Masukkan nama petugas lalu mulai scanner.",

      "info"
    );

  }
);

</script>

</body>

</html>

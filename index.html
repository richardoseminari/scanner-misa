<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>Scanner Check-In Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.10);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #1976d2;
      color: white;
      margin-bottom: 10px;
    }

    button:disabled {
      background: #aaa;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      background: #eee;
      line-height: 1.5;
      word-break: break-word;
    }

    .success {
      background: #dff5e1 !important;
      color: #146b1f;
    }

    .error {
      background: #ffe1e1 !important;
      color: #a00000;
    }

    .info {
      background: #e3f0ff !important;
      color: #15549a;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Scanner Check-In Misa</h1>

  <label for="petugas">Nama Petugas</label>

  <input
    type="text"
    id="petugas"
    placeholder="Masukkan nama petugas"
    autocomplete="name"
  >

  <button
    id="btnStart"
    type="button"
    onclick="mulaiScanner()">
    Mulai Scanner
  </button>

  <button
    id="btnStop"
    type="button"
    onclick="hentikanScanner()"
    class="hidden">
    Hentikan Scanner
  </button>

  <div id="reader"></div>

  <div id="status">
    Scanner belum dimulai.
  </div>

</div>

<script>

const CHECKIN_URL =
  "https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";

let html5QrCode = null;
let scannerAktif = false;
let sedangMemproses = false;

let checkInWindow = null;
let bridgeReady = false;
let qrMenunggu = null;


/* ================================
   STATUS
================================ */

function tampilStatus(pesan, tipe = "info") {

  const el = document.getElementById("status");

  el.className = "";

  if (tipe === "success") {
    el.classList.add("success");
  }

  if (tipe === "error") {
    el.classList.add("error");
  }

  if (tipe === "info") {
    el.classList.add("info");
  }

  el.innerHTML = pesan;
}


/* ================================
   CEK BROWSER
================================ */

function cekBrowser() {

  if (!window.isSecureContext) {

    tampilStatus(
      "Scanner membutuhkan koneksi HTTPS. " +
      "Pastikan halaman dibuka dari GitHub Pages.",
      "error"
    );

    return false;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    tampilStatus(
      "Browser HP tidak mendukung akses kamera melalui halaman ini. " +
      "Silakan gunakan Chrome atau Safari versi terbaru.",
      "error"
    );

    return false;
  }

  return true;
}


/* ================================
   BUKA BRIDGE CHECK-IN
   DIBUKA SEJAK TOMBOL DIKLIK
   AGAR TIDAK DIBLOKIR POPUP
================================ */

function bukaJembatanCheckIn() {

  try {

    bridgeReady = false;

    checkInWindow = window.open(
      CHECKIN_URL + "?page=checkin",
      "MisaCheckInBridge"
    );

    if (!checkInWindow) {

      tampilStatus(
        "Jendela Check-In diblokir browser. " +
        "Izinkan pop-up untuk situs ini lalu tekan Mulai Scanner lagi.",
        "error"
      );

      return false;
    }

    tampilStatus(
      "Menghubungkan ke server Check-In...",
      "info"
    );

    return true;

  } catch (err) {

    tampilStatus(
      "Jembatan Check-In gagal dibuka: " + err.message,
      "error"
    );

    return false;
  }
}


/* ================================
   TERIMA PESAN DARI APPS SCRIPT
================================ */

window.addEventListener("message", function(event) {

  const data = event.data;

  if (!data || !data.type) {
    return;
  }


  /* BRIDGE SIAP */

  if (data.type === "MISA_BRIDGE_READY") {

    bridgeReady = true;

    tampilStatus(
      "Server Check-In terhubung. Silakan scan QR tiket.",
      "info"
    );

    if (qrMenunggu) {

      kirimCheckIn(qrMenunggu);

      qrMenunggu = null;
    }

    return;
  }


  /* HASIL CHECK-IN */

  if (data.type === "MISA_CHECKIN_RESULT") {

    sedangMemproses = false;

    if (data.success) {

      tampilStatus(
        "<b>CHECK-IN BERHASIL</b><br><br>" +
        "Nama: " + aman(data.nama) + "<br>" +
        "Misa: " + aman(data.namaMisa) + "<br>" +
        "Jumlah: " + aman(data.jumlah) + "<br>" +
        "Waktu: " + aman(data.waktuCheckIn),
        "success"
      );

    } else {

      tampilStatus(
        "<b>CHECK-IN GAGAL</b><br><br>" +
        aman(data.message || "Check-in gagal."),
        "error"
      );
    }

    return;
  }

});


/* ================================
   START SCANNER
================================ */

async function mulaiScanner() {

  if (scannerAktif) {
    return;
  }

  if (!cekBrowser()) {
    return;
  }


  const petugas =
    document.getElementById("petugas").value.trim();

  if (!petugas) {

    tampilStatus(
      "Masukkan nama petugas terlebih dahulu.",
      "error"
    );

    document.getElementById("petugas").focus();

    return;
  }


  /*
   * Buka bridge ketika masih berada
   * dalam aksi klik pengguna.
   */
  bukaJembatanCheckIn();


  tampilStatus(
    "Meminta akses kamera...",
    "info"
  );


  try {

    /*
     * PERMINTAAN IZIN KAMERA SECARA EKSPLISIT
     */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });


    /*
     * Setelah izin berhasil,
     * matikan stream sementara.
     * html5-qrcode akan membuka kamera sendiri.
     */

    stream.getTracks().forEach(function(track) {
      track.stop();
    });


    tampilStatus(
      "Akses kamera berhasil. Membuka kamera belakang...",
      "info"
    );


    html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        const minEdge =
          Math.min(viewfinderWidth, viewfinderHeight);

        const size =
          Math.floor(minEdge * 0.70);

        return {
          width: size,
          height: size
        };
      },

      aspectRatio: 1.0,

      rememberLastUsedCamera: true

    };


    /*
     * Gunakan facingMode environment.
     * Ini lebih kompatibel dengan HP
     * dibanding pemilihan cameraId secara manual.
     */

    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerAktif = true;

    document.getElementById("btnStart")
      .classList.add("hidden");

    document.getElementById("btnStop")
      .classList.remove("hidden");


    tampilStatus(
      "Kamera aktif. Arahkan kamera ke QR tiket.",
      "info"
    );


  } catch (error) {

    console.error(error);

    scannerAktif = false;

    let pesan = "";


    if (error.name === "NotAllowedError") {

      pesan =
        "Akses kamera ditolak. " +
        "Buka izin Kamera untuk browser ini dan pilih Izinkan.";


    } else if (error.name === "NotFoundError") {

      pesan =
        "Kamera tidak ditemukan pada perangkat ini.";


    } else if (error.name === "NotReadableError") {

      pesan =
        "Kamera sedang digunakan aplikasi lain. " +
        "Tutup aplikasi yang sedang menggunakan kamera lalu coba lagi.";


    } else if (error.name === "SecurityError") {

      pesan =
        "Browser memblokir akses kamera karena alasan keamanan. " +
        "Pastikan halaman dibuka melalui HTTPS.";


    } else {

      pesan =
        "Kamera tidak dapat digunakan.<br><br>" +
        "<b>Detail:</b> " +
        aman(error.name || "") +
        "<br>" +
        aman(error.message || "");

    }


    tampilStatus(
      pesan,
      "error"
    );

  }

}


/* ================================
   SCAN BERHASIL
================================ */

function onScanSuccess(decodedText, decodedResult) {

  if (sedangMemproses) {
    return;
  }

  sedangMemproses = true;

  console.log(
    "QR TERBACA:",
    decodedText
  );


  tampilStatus(
    "QR terbaca. Memproses Check-In...",
    "info"
  );


  kirimCheckIn(decodedText);
}


/* ================================
   SCAN GAGAL
================================ */

function onScanFailure(errorMessage) {

  /*
   * Jangan tampilkan error setiap frame.
   * html5-qrcode memang sering memanggil
   * fungsi ini ketika belum menemukan QR.
   */

}


/* ================================
   KIRIM CHECK-IN
================================ */

function kirimCheckIn(idRegistrasi) {

  const petugas =
    document.getElementById("petugas").value.trim();


  if (!petugas) {

    sedangMemproses = false;

    tampilStatus(
      "Nama petugas belum diisi.",
      "error"
    );

    return;
  }


  /*
   * Jika bridge belum siap,
   * simpan QR sementara.
   */

  if (!checkInWindow ||
      checkInWindow.closed ||
      !bridgeReady) {

    qrMenunggu = idRegistrasi;

    tampilStatus(
      "Menunggu koneksi server Check-In...",
      "info"
    );

    return;
  }


  try {

    checkInWindow.postMessage(

      {
        type: "MISA_CHECKIN",
        idRegistrasi: idRegistrasi,
        petugas: petugas
      },

      "*"

    );


  } catch (error) {

    sedangMemproses = false;

    tampilStatus(
      "Gagal mengirim data Check-In: " +
      aman(error.message),
      "error"
    );
  }

}


/* ================================
   STOP SCANNER
================================ */

async function hentikanScanner() {

  if (!html5QrCode) {
    return;
  }


  try {

    if (scannerAktif) {

      await html5QrCode.stop();

    }

    try {
      await html5QrCode.clear();
    } catch (e) {}


  } catch (error) {

    console.error(error);

  }


  html5QrCode = null;

  scannerAktif = false;

  sedangMemproses = false;


  document.getElementById("btnStart")
    .classList.remove("hidden");

  document.getElementById("btnStop")
    .classList.add("hidden");


  tampilStatus(
    "Scanner dihentikan.",
    "info"
  );

}


/* ================================
   ESCAPE HTML
================================ */

function aman(value) {

  if (value === null ||
      value === undefined) {

    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ================================
   SAAT HALAMAN DITUTUP
================================ */

window.addEventListener(
  "beforeunload",
  function() {

    if (html5QrCode &&
        scannerAktif) {

      html5QrCode.stop()
        .catch(function() {});

    }

  }
);

</script>

</body>
</html>

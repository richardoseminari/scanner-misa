<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <meta name="theme-color" content="#17365d">

  <title>Scanner Check-In Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #202124;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(520px, 100%);
      margin: auto;
      padding: 16px;
    }

    .header {
      background: #17365d;
      color: white;
      border-radius: 18px;
      padding: 22px 16px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      font-size: 14px;
      opacity: .9;
    }

    .card {
      background: white;
      margin-top: 15px;
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #c9ced4;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #17365d;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      margin-top: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #17365d;
      color: white;
    }

    button.secondary {
      background: #68737d;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }

    .status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info {
      background: #e8f1fb;
      color: #17365d;
    }

    .success {
      background: #e8f7ed;
      color: #176b36;
    }

    .error {
      background: #ffe9ed;
      color: #a51d32;
    }

    .warning {
      background: #fff4d6;
      color: #765800;
    }

    .small {
      margin-top: 12px;
      color: #68737d;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 Scanner Check-In</h1>
    <p>Registrasi Misa</p>
  </div>


  <div class="card">

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      id="petugas"
      type="text"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >

    <button
      id="startButton"
      type="button"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>

    <button
      id="stopButton"
      type="button"
      class="secondary hidden"
      onclick="hentikanScanner()"
    >
      ✕ Tutup Kamera
    </button>

    <div id="reader" class="hidden"></div>

    <div
      id="status"
      class="status info"
    >
      Masukkan nama petugas kemudian tekan
      "Mulai Scanner".
    </div>

    <div class="small">
      Arahkan kamera ke QR Code pada e-ticket peserta.
      Pada tahap ini hasil QR hanya ditampilkan dan belum
      melakukan check-in ke Google Sheets.
    </div>

  </div>

</div>


<script>

let scanner = null;

let scannerAktif = false;

let sedangMemproses = false;


/* ================================
   STATUS
================================ */

function tampilStatus(type, message) {

  const box = document.getElementById("status");

  box.className = "status " + type;

  box.textContent = message;

}


/* ================================
   MULAI SCANNER
================================ */

async function mulaiScanner() {

  const petugas =
    document.getElementById("petugas").value.trim();


  if (!petugas) {

    tampilStatus(
      "warning",
      "Silakan isi nama petugas terlebih dahulu."
    );

    document.getElementById("petugas").focus();

    return;
  }


  if (scannerAktif) {
    return;
  }


  tampilStatus(
    "info",
    "Membuka kamera..."
  );


  try {

    scanner = new Html5Qrcode("reader");


    document
      .getElementById("reader")
      .classList.remove("hidden");


    document
      .getElementById("startButton")
      .classList.add("hidden");


    document
      .getElementById("stopButton")
      .classList.remove("hidden");


    scannerAktif = true;


    await scanner.start(

      {
        facingMode: {
          ideal: "environment"
        }
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size = Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.70;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      function(decodedText) {

        hasilScan(decodedText);

      },

      function(errorMessage) {

        // Error scanning biasa diabaikan.
        // Scanner tetap berjalan.

      }

    );


    tampilStatus(
      "success",
      "Kamera aktif.\n\nArahkan kamera ke QR Code tiket."
    );

  }

  catch(error) {

    scannerAktif = false;

    document
      .getElementById("reader")
      .classList.add("hidden");


    document
      .getElementById("startButton")
      .classList.remove("hidden");


    document
      .getElementById("stopButton")
      .classList.add("hidden");


    tampilStatus(

      "error",

      "Kamera tidak dapat dibuka.\n\n" +

      "Error: " +
      (error.name || "UnknownError") +

      "\n\n" +

      (error.message || error)

    );

  }

}


/* ================================
   HASIL QR
================================ */

async function hasilScan(decodedText) {

  if (sedangMemproses) {
    return;
  }


  sedangMemproses = true;


  // Hentikan scanner supaya QR yang sama
  // tidak terbaca berkali-kali.
  await hentikanScannerInternal();


  tampilStatus(

    "success",

    "QR BERHASIL TERBACA ✅\n\n" +

    "Isi QR:\n" +

    decodedText +

    "\n\n" +

    "Scanner QR bekerja dengan baik.\n" +

    "Belum ada proses check-in ke Google Sheets."

  );


  sedangMemproses = false;

}


/* ================================
   HENTIKAN SCANNER INTERNAL
================================ */

async function hentikanScannerInternal() {

  if (!scanner || !scannerAktif) {
    return;
  }


  try {

    await scanner.stop();

  }

  catch(error) {

    console.log(
      "Scanner stop:",
      error
    );

  }


  try {

    scanner.clear();

  }

  catch(error) {

    console.log(
      "Scanner clear:",
      error
    );

  }


  scanner = null;

  scannerAktif = false;


  document
    .getElementById("reader")
    .classList.add("hidden");


  document
    .getElementById("startButton")
    .classList.remove("hidden");


  document
    .getElementById("stopButton")
    .classList.add("hidden");

}


/* ================================
   TOMBOL TUTUP KAMERA
================================ */

async function hentikanScanner() {

  await hentikanScannerInternal();


  tampilStatus(

    "info",

    "Kamera ditutup.\n\n" +
    "Tekan \"Mulai Scanner\" untuk memulai lagi."

  );

}


/* ================================
   SAAT HALAMAN DITINGGALKAN
================================ */

window.addEventListener(
  "pagehide",
  function() {

    if (scanner && scannerAktif) {

      scanner.stop().catch(
        function() {}
      );

    }

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">

  <title>Scanner Check-In Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      padding:20px;
      font-family:Arial,sans-serif;
      background:#f4f4f4;
    }
    .box{
      max-width:520px;
      margin:auto;
      background:#fff;
      padding:20px;
      border-radius:16px;
      box-shadow:0 3px 15px rgba(0,0,0,.12);
    }
    h2{text-align:center;margin-top:0}
    input,button{
      width:100%;
      padding:14px;
      margin-bottom:12px;
      border-radius:10px;
      font-size:16px;
    }
    input{border:1px solid #ccc}
    button{
      border:0;
      background:#1976d2;
      color:white;
      font-weight:bold;
    }
    button:disabled{background:#999}
    #reader{width:100%;margin-top:15px}
    #status{
      padding:14px;
      border-radius:10px;
      background:#eee;
      line-height:1.5;
      margin-top:15px;
      word-break:break-word;
    }
    .ok{background:#dff5e1!important;color:#176b22}
    .err{background:#ffe0e0!important;color:#a00000}
    .info{background:#e4f0ff!important;color:#14518f}
    .hidden{display:none}
  </style>
</head>

<body>

<div class="box">

  <h2>Scanner Check-In Misa</h2>

  <input
    id="petugas"
    type="text"
    placeholder="Nama petugas"
    autocomplete="name"
  >

  <button id="btnStart" onclick="mulaiScanner()">
    Mulai Scanner
  </button>

  <button
    id="btnStop"
    class="hidden"
    onclick="stopScanner()">
    Hentikan Scanner
  </button>

  <div id="reader"></div>

  <div id="status">
    Scanner belum dimulai.
  </div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";

let scanner = null;
let aktif = false;
let sedangProses = false;
let callbackCounter = 0;


/* =========================
   STATUS
========================= */

function status(text, type="info") {

  const el = document.getElementById("status");

  el.className = "";

  if(type === "ok") el.classList.add("ok");
  if(type === "err") el.classList.add("err");
  if(type === "info") el.classList.add("info");

  el.innerHTML = text;
}


/* =========================
   MULAI SCANNER
========================= */

async function mulaiScanner() {

  const petugas =
    document.getElementById("petugas").value.trim();

  if(!petugas){

    status(
      "Masukkan nama petugas terlebih dahulu.",
      "err"
    );

    return;
  }

  if(!window.isSecureContext){

    status(
      "Halaman tidak menggunakan HTTPS. Buka scanner melalui GitHub Pages.",
      "err"
    );

    return;
  }

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    status(
      "Browser ini tidak mendukung akses kamera. Gunakan Chrome atau Safari terbaru.",
      "err"
    );

    return;
  }

  status(
    "Meminta akses kamera...",
    "info"
  );

  try {

    /*
     * Meminta izin kamera secara langsung.
     */
    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:"environment"
          }
        },
        audio:false
      });

    /*
     * Stop stream percobaan.
     * html5-qrcode akan membuka kamera sendiri.
     */
    stream.getTracks().forEach(
      track => track.stop()
    );

    scanner =
      new Html5Qrcode("reader");

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:10,

        qrbox:function(width,height){

          const size =
            Math.floor(
              Math.min(width,height) * 0.70
            );

          return {
            width:size,
            height:size
          };
        },

        aspectRatio:1.0,

        rememberLastUsedCamera:true
      },

      qrBerhasil,

      function(){}

    );

    aktif = true;

    document
      .getElementById("btnStart")
      .classList.add("hidden");

    document
      .getElementById("btnStop")
      .classList.remove("hidden");

    status(
      "Kamera aktif. Arahkan kamera ke QR tiket.",
      "info"
    );

  } catch(error){

    console.error(error);

    let pesan =
      "Kamera tidak dapat digunakan.";

    if(error.name === "NotAllowedError"){

      pesan =
        "Akses kamera ditolak. Pastikan izin kamera untuk browser sudah diizinkan.";

    }else if(error.name === "NotFoundError"){

      pesan =
        "Kamera tidak ditemukan.";

    }else if(error.name === "NotReadableError"){

      pesan =
        "Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.";

    }else if(error.name === "SecurityError"){

      pesan =
        "Browser memblokir kamera. Pastikan membuka scanner melalui HTTPS.";

    }

    status(
      pesan +
      "<br><br><small>" +
      escapeHtml(error.name || "") +
      "</small>",
      "err"
    );
  }
}


/* =========================
   QR BERHASIL
========================= */

function qrBerhasil(decodedText){

  if(sedangProses){
    return;
  }

  sedangProses = true;

  const idRegistrasi =
    decodedText.trim();

  const petugas =
    document.getElementById("petugas")
      .value.trim();

  status(
    "QR terbaca.<br>Memeriksa tiket...",
    "info"
  );

  prosesCheckIn(
    idRegistrasi,
    petugas
  );
}


/* =========================
   CHECK-IN VIA JSONP
========================= */

function prosesCheckIn(
  idRegistrasi,
  petugas
){

  callbackCounter++;

  const callbackName =
    "checkInCallback_" +
    Date.now() +
    "_" +
    callbackCounter;

  const script =
    document.createElement("script");

  let selesai = false;

  window[callbackName] =
    function(data){

      selesai = true;

      try{

        if(data.success){

          status(
            "<b>CHECK-IN BERHASIL</b><br><br>" +
            "Nama: " +
            escapeHtml(data.nama || "") +
            "<br>" +
            "Misa: " +
            escapeHtml(data.namaMisa || "") +
            "<br>" +
            "Jumlah: " +
            escapeHtml(String(data.jumlah || "")) +
            "<br>" +
            "Waktu: " +
            escapeHtml(data.waktuCheckIn || ""),
            "ok"
          );

        }else{

          status(
            "<b>CHECK-IN GAGAL</b><br><br>" +
            escapeHtml(
              data.message ||
              "Tiket tidak dapat diproses."
            ),
            "err"
          );
        }

      }finally{

        sedangProses = false;

        delete window[callbackName];

        if(script.parentNode){
          script.parentNode.removeChild(script);
        }
      }
    };


  script.onerror = function(){

    if(selesai){
      return;
    }

    sedangProses = false;

    delete window[callbackName];

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }

    status(
      "<b>SERVER TIDAK DAPAT DIHUBUNGI</b><br><br>" +
      "Gagal menghubungi server Check-In.",
      "err"
    );
  };


  const url =
    API +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(idRegistrasi) +
    "&petugas=" +
    encodeURIComponent(petugas) +
    "&callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  script.src = url;

  document.body.appendChild(script);
}


/* =========================
   STOP
========================= */

async function stopScanner(){

  if(scanner){

    try{
      await scanner.stop();
    }catch(e){}

    try{
      await scanner.clear();
    }catch(e){}
  }

  scanner = null;
  aktif = false;
  sedangProses = false;

  document
    .getElementById("btnStart")
    .classList.remove("hidden");

  document
    .getElementById("btnStop")
    .classList.add("hidden");

  status(
    "Scanner dihentikan.",
    "info"
  );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

</script>

</body>
</html>

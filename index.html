<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 6px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start {
      background: #2563eb;
      color: white;
    }

    .again {
      background: #111827;
      color: white;
      margin-top: 12px;
      display: none;
    }

    #scannerCard {
      display: none;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    #status {
      display: none;
      margin-top: 16px;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    .checking {
      display: block !important;
      background: #fef3c7;
      color: #92400e;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .warning {
      display: block !important;
      background: #fef3c7;
      color: #92400e;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    #info {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      background: #f9fafb;
      font-size: 14px;
      line-height: 1.7;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      padding: 10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>📷 Scanner Misa</h1>

    <div class="subtitle">
      Scan QR e-Ticket untuk Check-In
    </div>

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      id="petugas"
      type="text"
      placeholder="Contoh: Richard"
      autocomplete="off"
    >

    <button
      class="start"
      type="button"
      onclick="mulai()"
    >
      📷 MULAI SCANNER
    </button>
  </div>


  <div
    class="card"
    id="scannerCard"
  >

    <div id="reader"></div>

    <div id="status"></div>

    <div id="info"></div>

    <button
      id="again"
      class="again"
      type="button"
      onclick="scanLagi()"
    >
      🔄 SCAN LAGI
    </button>

  </div>

  <div class="footer">
    Sistem Check-In Misa
  </div>

</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


let qrScanner = null;
let kameraAktif = false;
let sedangProses = false;
let namaPetugas = "";


/* =====================================================
   MULAI
===================================================== */

function mulai() {

  namaPetugas =
    document.getElementById("petugas")
    .value
    .trim();

  if (!namaPetugas) {
    alert("Isi nama petugas terlebih dahulu.");
    return;
  }

  document.getElementById(
    "scannerCard"
  ).style.display = "block";

  resetTampilan();

  mulaiKamera();
}


/* =====================================================
   KAMERA
===================================================== */

function mulaiKamera() {

  if (kameraAktif) {
    return;
  }

  qrScanner =
    new Html5Qrcode("reader");

  qrScanner
    .start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      ketikaQRTerbaca,
      function() {}
    )
    .then(function() {

      kameraAktif = true;

    })
    .catch(function(error) {

      tampilError(
        "❌ KAMERA TIDAK DAPAT DIBUKA",
        "Izinkan akses kamera pada browser."
      );

      console.error(error);

    });
}


/* =====================================================
   QR TERBACA
===================================================== */

function ketikaQRTerbaca(
  isiQR
) {

  if (sedangProses) {
    return;
  }

  sedangProses = true;

  hentikanKamera();

  /*
   * QR KITA BERISI LANGSUNG:
   *
   * REG-UND5UM9KXV
   */

  const idRegistrasi =
    isiQR.trim();

  if (
    !/^REG-[A-Za-z0-9_-]+$/i.test(
      idRegistrasi
    )
  ) {

    tampilError(
      "❌ QR TIDAK VALID",
      "QR tidak berisi ID registrasi yang valid."
    );

    tampilkanTombolLagi();

    sedangProses = false;

    return;
  }

  tampilChecking();

  /*
   * PENTING:
   *
   * Kita menggunakan IMAGE BEACON
   * untuk memastikan request GET
   * benar-benar dikirim ke Apps Script.
   *
   * Setelah request dikirim, kita membuka
   * halaman hasil di popup/tab baru.
   */

  kirimKeServer(
    idRegistrasi
  );
}


/* =====================================================
   KIRIM KE SERVER
===================================================== */

function kirimKeServer(
  idRegistrasi
) {

  const callback =
    "hasilCheckIn";


  const url =
    APPS_SCRIPT_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(
      idRegistrasi
    ) +
    "&petugas=" +
    encodeURIComponent(
      namaPetugas
    ) +
    "&callback=" +
    callback +
    "&_=" +
    Date.now();


  /*
   * Buat iframe tersembunyi.
   *
   * Browser akan membuka endpoint Apps Script.
   */

  const iframe =
    document.createElement(
      "iframe"
    );

  iframe.style.display =
    "none";

  iframe.src =
    url;


  document.body.appendChild(
    iframe
  );


  /*
   * Karena Apps Script mengembalikan
   * JavaScript JSONP, kita juga pasang
   * callback global.
   */

  window.hasilCheckIn =
    function(response) {

      console.log(
        "HASIL CHECK-IN:",
        response
      );


      try {

        if (
          iframe.parentNode
        ) {

          iframe.parentNode.removeChild(
            iframe
          );

        }

      } catch (e) {}


      prosesHasil(
        response
      );

    };


  /*
   * Timeout.
   */

  setTimeout(
    function() {

      /*
       * Kalau callback sudah terpanggil,
       * tidak perlu melakukan apa-apa.
       */

      if (
        !sedangProses
      ) {
        return;
      }


      tampilError(
        "❌ SERVER CHECK-IN TIDAK DAPAT DIHUBUNGI",
        "Silakan coba scan kembali."
      );

      tampilkanTombolLagi();

      sedangProses = false;

    },
    15000
  );

}


/* =====================================================
   HASIL SERVER
===================================================== */

function prosesHasil(
  response
) {

  if (!response) {

    tampilError(
      "❌ SERVER ERROR",
      "Server tidak memberikan hasil."
    );

    tampilkanTombolLagi();

    sedangProses = false;

    return;
  }


  /*
   * BERHASIL
   */

  if (
    response.success === true
  ) {

    tampilSukses(
      response
    );

    tampilkanTombolLagi();

    sedangProses = false;

    return;
  }


  /*
   * SUDAH CHECK-IN
   */

  if (
    response.alreadyCheckedIn === true
  ) {

    tampilSudahCheckIn(
      response
    );

    tampilkanTombolLagi();

    sedangProses = false;

    return;
  }


  /*
   * TIDAK TERDAFTAR
   */

  tampilError(
    "❌ TIDAK TERDAFTAR",
    response.message ||
    "Tiket tidak ditemukan."
  );

  tampilkanTombolLagi();

  sedangProses = false;
}


/* =====================================================
   TAMPIL SUKSES
===================================================== */

function tampilSukses(
  data
) {

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    "success";

  status.innerHTML =
    "✅ TERDAFTAR<br>" +
    "<span style='font-size:14px;font-weight:normal'>" +
    escapeHtml(
      data.message ||
      "Check-in berhasil."
    ) +
    "</span>";

  status.style.display =
    "block";


  tampilInfo(
    data
  );
}


/* =====================================================
   SUDAH CHECK-IN
===================================================== */

function tampilSudahCheckIn(
  data
) {

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    "warning";

  status.innerHTML =
    "⚠️ SUDAH CHECK-IN<br>" +
    "<span style='font-size:14px;font-weight:normal'>" +
    escapeHtml(
      data.message ||
      "Tiket ini sudah melakukan check-in."
    ) +
    "</span>";

  status.style.display =
    "block";


  tampilInfo(
    data
  );
}


/* =====================================================
   CHECKING
===================================================== */

function tampilChecking() {

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    "checking";

  status.innerHTML =
    "⏳ MEMERIKSA TIKET...";

  status.style.display =
    "block";
}


/* =====================================================
   ERROR
===================================================== */

function tampilError(
  judul,
  pesan
) {

  const status =
    document.getElementById(
      "status"
    );

  status.className =
    "error";

  status.innerHTML =
    judul +
    "<br>" +
    "<span style='font-size:14px;font-weight:normal'>" +
    escapeHtml(
      pesan
    ) +
    "</span>";

  status.style.display =
    "block";


  document.getElementById(
    "info"
  ).style.display =
    "none";
}


/* =====================================================
   INFO
===================================================== */

function tampilInfo(
  data
) {

  const info =
    document.getElementById(
      "info"
    );

  let html = "";


  if (data.nama) {

    html +=
      "<div><b>Nama:</b> " +
      escapeHtml(
        data.nama
      ) +
      "</div>";

  }


  if (data.idRegistrasi) {

    html +=
      "<div><b>ID:</b> " +
      escapeHtml(
        data.idRegistrasi
      ) +
      "</div>";

  }


  if (data.namaMisa) {

    html +=
      "<div><b>Misa:</b> " +
      escapeHtml(
        data.namaMisa
      ) +
      "</div>";

  }


  if (data.tanggal) {

    html +=
      "<div><b>Tanggal:</b> " +
      escapeHtml(
        data.tanggal
      ) +
      "</div>";

  }


  if (data.jam) {

    html +=
      "<div><b>Jam:</b> " +
      escapeHtml(
        data.jam
      ) +
      "</div>";

  }


  if (data.jumlah) {

    html +=
      "<div><b>Jumlah:</b> " +
      escapeHtml(
        data.jumlah
      ) +
      "</div>";

  }


  if (data.waktuCheckIn) {

    html +=
      "<div><b>Check-In:</b> " +
      escapeHtml(
        data.waktuCheckIn
      ) +
      "</div>";

  }


  if (data.petugasSebelumnya) {

    html +=
      "<div><b>Petugas:</b> " +
      escapeHtml(
        data.petugasSebelumnya
      ) +
      "</div>";

  }


  info.innerHTML =
    html;

  info.style.display =
    "block";
}


/* =====================================================
   TOMBOL SCAN LAGI
===================================================== */

function tampilkanTombolLagi() {

  document.getElementById(
    "again"
  ).style.display =
    "block";
}


function scanLagi() {

  sedangProses = false;

  resetTampilan();

  document.getElementById(
    "again"
  ).style.display =
    "none";

  mulaiKamera();
}


/* =====================================================
   STOP KAMERA
===================================================== */

function hentikanKamera() {

  if (
    qrScanner &&
    kameraAktif
  ) {

    qrScanner
      .stop()
      .then(function() {

        kameraAktif = false;

      })
      .catch(function() {

        kameraAktif = false;

      });
  }
}


/* =====================================================
   RESET
===================================================== */

function resetTampilan() {

  const status =
    document.getElementById(
      "status"
    );

  status.style.display =
    "none";

  status.innerHTML =
    "";

  status.className =
    "";


  const info =
    document.getElementById(
      "info"
    );

  info.style.display =
    "none";

  info.innerHTML =
    "";
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


window.addEventListener(
  "beforeunload",
  function() {
    hentikanKamera();
  }
);

</script>

</body>
</html>

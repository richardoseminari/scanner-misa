<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Misa</title>


  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #202124;
    }


    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }


    .header {
      background: #17365d;
      color: white;
      padding: 22px 18px;
      border-radius: 18px;
      margin-bottom: 18px;
      text-align: center;
    }


    .header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }


    .header p {
      margin: 0;
      font-size: 14px;
      opacity: .9;
    }


    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }


    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }


    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }


    input:focus {
      border-color: #17365d;
    }


    button {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }


    .btn-primary {
      background: #17365d;
      color: white;
    }


    .btn-secondary {
      background: #e9eef5;
      color: #17365d;
    }


    .btn-danger {
      background: #c62828;
      color: white;
    }


    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 15px;
      background: #111;
    }


    .status {
      padding: 14px;
      border-radius: 12px;
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }


    .status.info {
      display: block;
      background: #e8f1fb;
      color: #17365d;
    }


    .status.success {
      display: block;
      background: #e8f5e9;
      color: #1b5e20;
    }


    .status.error {
      display: block;
      background: #ffebee;
      color: #b71c1c;
    }


    .status.warning {
      display: block;
      background: #fff8e1;
      color: #8d6e00;
    }


    .result {
      display: none;
    }


    .result h2 {
      margin-top: 0;
    }


    .data-row {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }


    .data-row:last-child {
      border-bottom: 0;
    }


    .label-small {
      color: #777;
      font-size: 12px;
    }


    .value {
      font-weight: bold;
      margin-top: 3px;
    }


    .hidden {
      display: none !important;
    }


    .camera-help {
      margin-top: 12px;
      padding: 13px;
      background: #f8f9fa;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #555;
    }


    .loading {
      text-align: center;
      padding: 15px;
      display: none;
    }

  </style>

</head>


<body>


<div class="container">


  <div class="header">

    <h1>📷 Scanner Misa</h1>

    <p>
      Scan QR Code tiket umat
    </p>

  </div>


  <!-- PETUGAS -->

  <div
    class="card"
    id="petugasCard"
  >

    <label for="petugas">
      Nama Petugas
    </label>


    <input
      type="text"
      id="petugas"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >


    <button
      type="button"
      class="btn-primary"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>


    <div
      id="statusAwal"
      class="status"
    ></div>


    <div class="camera-help">

      <b>Catatan:</b><br>

      Izinkan browser menggunakan kamera
      ketika diminta.

    </div>

  </div>


  <!-- SCANNER -->

  <div
    class="card hidden"
    id="scannerCard"
  >

    <h3 style="margin-top:0;">
      Arahkan kamera ke QR tiket
    </h3>


    <div id="reader"></div>


    <div
      id="scannerStatus"
      class="status info"
    >
      Menunggu QR Code...
    </div>


    <button
      type="button"
      class="btn-danger"
      onclick="stopScanner()"
    >
      ✕ Tutup Kamera
    </button>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >
    ⏳ Mengirim check-in...
  </div>


  <!-- RESULT -->

  <div
    class="card result"
    id="resultCard"
  >

    <h2 id="resultTitle"></h2>


    <div
      id="resultStatus"
      class="status"
    ></div>


    <div id="resultData"></div>


    <button
      type="button"
      class="btn-primary"
      onclick="scanBerikutnya()"
    >
      📷 Scan Tiket Berikutnya
    </button>

  </div>


</div>


<script>


/* =====================================================
   VARIABEL
===================================================== */

let html5QrCode = null;

let scannerAktif = false;

let sedangMemproses = false;

let checkInWindow = null;


/* =====================================================
   URL CHECK-IN APPS SCRIPT
===================================================== */

const CHECKIN_URL =
  "https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec?page=checkin";


/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner() {

  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  if (!petugas) {

    tampilStatus(
      "statusAwal",
      "Masukkan nama petugas terlebih dahulu.",
      "warning"
    );

    return;
  }


  tampilStatus(
    "statusAwal",
    "Menyiapkan scanner...",
    "info"
  );


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    tampilStatus(
      "statusAwal",
      "Library scanner belum berhasil dimuat. Refresh halaman.",
      "error"
    );

    return;
  }


  try {

    /*
     * Pastikan kamera tersedia.
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung kamera."
      );

    }


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    /*
     * Hanya meminta izin.
     * Setelah itu stream ditutup karena
     * Html5Qrcode akan membuka kamera sendiri.
     */

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    /*
     * Tampilan.
     */

    document
      .getElementById(
        "petugasCard"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "scannerCard"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "resultCard"
      )
      .style
      .display = "none";


    /*
     * Buat scanner.
     */

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox:
        function(
          width,
          height
        ) {

          const minEdge =
            Math.min(
              width,
              height
            );

          const size =
            Math.floor(
              minEdge * 0.70
            );

          return {

            width: size,

            height: size

          };

        },

      aspectRatio: 1.0

    };


    await html5QrCode.start(

      {
        facingMode:
          "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerAktif = true;


    tampilStatus(
      "scannerStatus",
      "Kamera aktif. Arahkan ke QR Code tiket.",
      "info"
    );

  }


  catch (error) {

    console.error(
      "Camera error:",
      error
    );


    document
      .getElementById(
        "scannerCard"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "petugasCard"
      )
      .classList
      .remove("hidden");


    tampilStatus(
      "statusAwal",
      "Kamera tidak dapat digunakan. Pastikan izin kamera diberikan.",
      "error"
    );

  }

}


/* =====================================================
   QR BERHASIL
===================================================== */

async function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (sedangMemproses) {
    return;
  }


  sedangMemproses = true;


  console.log(
    "QR TERBACA:",
    decodedText
  );


  /*
   * Hentikan kamera.
   */

  await stopScanner();


  /*
   * Ambil petugas.
   */

  const petugas =
    document
      .getElementById(
        "petugas"
      )
      .value
      .trim();


  /*
   * QR e-ticket kita memang langsung
   * berisi ID_REGISTRASI.
   *
   * Contoh:
   *
   * REG-UND5UM9KXV
   */

  const idRegistrasi =
    ambilIDRegistrasi(
      decodedText
    );


  if (!idRegistrasi) {

    document
      .getElementById(
        "loading"
      )
      .style
      .display = "none";


    tampilHasil({

      success: false,

      alreadyCheckedIn: false,

      message:
        "QR Code tidak berisi ID registrasi yang valid."

    });


    sedangMemproses = false;

    return;
  }


  /*
   * Tampilkan loading.
   */

  document
    .getElementById(
      "loading"
    )
    .style
    .display = "block";


  /*
   * Buka CheckIn.html Apps Script.
   *
   * CheckIn.html akan menggunakan
   * google.script.run untuk memproses
   * check-in.
   */

  bukaJembatanCheckIn();


  /*
   * Beri sedikit waktu agar halaman
   * CheckIn.html selesai dimuat.
   */

  setTimeout(
    function() {

      kirimKeJembatan(
        idRegistrasi,
        petugas
      );

    },
    1200
  );

}


/* =====================================================
   AMBIL ID REGISTRASI
===================================================== */

function ambilIDRegistrasi(
  text
) {

  if (!text) {
    return "";
  }


  const value =
    String(text)
      .trim();


  /*
   * QR kita langsung berisi REG-...
   */

  if (
    /^REG-[A-Za-z0-9_-]+$/i
      .test(value)
  ) {

    return value;

  }


  /*
   * Kalau suatu saat QR berisi URL,
   * coba ambil parameter id.
   */

  try {

    const url =
      new URL(value);


    const id =
      url.searchParams.get(
        "id"
      );


    if (
      id &&
      /^REG-/i.test(id)
    ) {

      return id;

    }

  }

  catch (error) {

    // Bukan URL.

  }


  /*
   * Cari REG- di dalam teks.
   */

  const match =
    value.match(
      /REG-[A-Za-z0-9_-]+/i
    );


  if (match) {
    return match[0];
  }


  return "";

}


/* =====================================================
   BUKA JEMBATAN
===================================================== */

function bukaJembatanCheckIn() {

  /*
   * Kalau sudah ada window jembatan
   * dan masih terbuka, gunakan itu.
   */

  if (
    checkInWindow &&
    !checkInWindow.closed
  ) {

    return;

  }


  /*
   * Buka halaman Apps Script
   * CheckIn.html.
   */

  checkInWindow =
    window.open(
      CHECKIN_URL,
      "MisaCheckInBridge"
    );


  if (!checkInWindow) {

    document
      .getElementById(
        "loading"
      )
      .style
      .display = "none";


    tampilHasil({

      success: false,

      alreadyCheckedIn: false,

      message:
        "Browser memblokir jendela Check-In. Izinkan pop-up untuk situs ini."

    });


    sedangMemproses = false;

  }

}


/* =====================================================
   KIRIM DATA KE CHECKIN.HTML
===================================================== */

function kirimKeJembatan(
  idRegistrasi,
  petugas
) {

  if (
    !checkInWindow ||
    checkInWindow.closed
  ) {

    document
      .getElementById(
        "loading"
      )
      .style
      .display = "none";


    tampilHasil({

      success: false,

      alreadyCheckedIn: false,

      message:
        "Halaman server check-in tidak terbuka."

    });


    sedangMemproses = false;

    return;
  }


  checkInWindow.postMessage(

    {

      type:
        "MISA_CHECKIN",

      idRegistrasi:
        idRegistrasi,

      petugas:
        petugas

    },

    "*"

  );

}


/* =====================================================
   TERIMA HASIL DARI CHECKIN.HTML
===================================================== */

window.addEventListener(
  "message",
  function(event) {

    console.log(
      "HASIL DARI CHECK-IN:",
      event.data
    );


    if (
      !event.data ||
      event.data.type !==
        "MISA_CHECKIN_RESULT"
    ) {

      return;

    }


    /*
     * Pastikan ini memang response
     * dari jendela CheckIn.
     */

    if (
      checkInWindow &&
      event.source !==
        checkInWindow
    ) {

      return;

    }


    document
      .getElementById(
        "loading"
      )
      .style
      .display = "none";


    tampilHasil(
      event.data
    );


    sedangMemproses = false;

  }
);


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

  if (
    html5QrCode
  ) {

    try {

      if (
        scannerAktif
      ) {

        await html5QrCode.stop();

      }

    }

    catch (error) {

      console.log(
        "Scanner stop:",
        error
      );

    }


    try {

      html5QrCode.clear();

    }

    catch (error) {

      console.log(
        "Scanner clear:",
        error
      );

    }

  }


  html5QrCode =
    null;

  scannerAktif =
    false;

}


/* =====================================================
   HASIL
===================================================== */

function tampilHasil(
  result
) {

  document
    .getElementById(
      "resultCard"
    )
    .style
    .display = "block";


  const title =
    document.getElementById(
      "resultTitle"
    );


  const status =
    document.getElementById(
      "resultStatus"
    );


  const data =
    document.getElementById(
      "resultData"
    );


  data.innerHTML =
    "";


  /*
   * SUDAH CHECK-IN
   */

  if (
    result &&
    result.alreadyCheckedIn
  ) {

    title.textContent =
      "⚠️ SUDAH CHECK-IN";


    tampilStatusElement(
      status,
      result.message ||
        "Tiket ini sudah melakukan check-in.",
      "warning"
    );


    tambahData(
      data,
      "ID Registrasi",
      result.idRegistrasi
    );


    tambahData(
      data,
      "Nama",
      result.nama
    );


    tambahData(
      data,
      "Misa",
      result.namaMisa
    );


    tambahData(
      data,
      "Tanggal",
      result.tanggal
    );


    tambahData(
      data,
      "Jam",
      result.jam
    );


    tambahData(
      data,
      "Jumlah",
      result.jumlah
        ? result.jumlah + " umat"
        : ""
    );


    tambahData(
      data,
      "Waktu Check-In",
      result.waktuCheckIn
    );


    tambahData(
      data,
      "Petugas Sebelumnya",
      result.petugasSebelumnya
    );


    return;
  }


  /*
   * BERHASIL
   */

  if (
    result &&
    result.success === true
  ) {

    title.textContent =
      "✅ CHECK-IN BERHASIL";


    tampilStatusElement(
      status,
      result.message ||
        "Tiket berhasil digunakan.",
      "success"
    );


    tambahData(
      data,
      "ID Registrasi",
      result.idRegistrasi
    );


    tambahData(
      data,
      "Nama",
      result.nama
    );


    tambahData(
      data,
      "Misa",
      result.namaMisa
    );


    tambahData(
      data,
      "Tanggal",
      result.tanggal
    );


    tambahData(
      data,
      "Jam",
      result.jam
    );


    tambahData(
      data,
      "Jumlah",
      result.jumlah
        ? result.jumlah + " umat"
        : ""
    );


    tambahData(
      data,
      "Waktu Check-In",
      result.waktuCheckIn
    );


    return;
  }


  /*
   * ERROR
   */

  title.textContent =
    "❌ CHECK-IN DITOLAK";


  tampilStatusElement(
    status,
    result &&
    result.message
      ? result.message
      : "Tiket tidak dapat digunakan.",
    "error"
  );


  if (
    result &&
    result.idRegistrasi
  ) {

    tambahData(
      data,
      "ID Registrasi",
      result.idRegistrasi
    );

  }

}


/* =====================================================
   STATUS HASIL
===================================================== */

function tampilStatusElement(
  element,
  message,
  type
) {

  element.className =
    "status " + type;

  element.textContent =
    message;

  element.style.display =
    "block";

}


/* =====================================================
   DATA
===================================================== */

function tambahData(
  parent,
  label,
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return;

  }


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "data-row";


  const labelDiv =
    document.createElement(
      "div"
    );

  labelDiv.className =
    "label-small";

  labelDiv.textContent =
    label;


  const valueDiv =
    document.createElement(
      "div"
    );

  valueDiv.className =
    "value";

  valueDiv.textContent =
    String(value);


  row.appendChild(
    labelDiv
  );

  row.appendChild(
    valueDiv
  );


  parent.appendChild(
    row
  );

}


/* =====================================================
   SCAN BERIKUTNYA
===================================================== */

function scanBerikutnya() {

  document
    .getElementById(
      "resultCard"
    )
    .style
    .display = "none";


  document
    .getElementById(
      "loading"
    )
    .style
    .display = "none";


  sedangMemproses =
    false;


  mulaiScanner();

}


/* =====================================================
   STATUS UMUM
===================================================== */

function tampilStatus(
  id,
  message,
  type
) {

  const element =
    document.getElementById(
      id
    );


  if (!element) {
    return;
  }


  element.className =
    "status " + type;


  element.textContent =
    message;


  element.style.display =
    "block";

}

</script>


</body>

</html>

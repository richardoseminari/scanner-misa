<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-start {
      background: #2563eb;
      color: white;
    }

    .btn-start:active {
      background: #1d4ed8;
    }

    .btn-scan-again {
      background: #111827;
      color: white;
      display: none;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
    }

    .status {
      display: none;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      margin-top: 16px;
      font-weight: bold;
      line-height: 1.5;
    }

    .status.checking {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .ticket-info {
      margin-top: 14px;
      display: none;
      background: #f9fafb;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .ticket-info strong {
      color: #111827;
    }

    .footer {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      padding: 10px 0 20px;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 8px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 Scanner Misa</h1>
    <p>Scan QR e-Ticket untuk Check-In</p>
  </div>

  <!-- PETUGAS -->
  <div class="card">

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      type="text"
      id="petugas"
      placeholder="Contoh: Richard"
      autocomplete="off"
    >

    <button
      type="button"
      class="btn-start"
      onclick="mulaiScanner()"
    >
      📷 MULAI SCANNER
    </button>

    <div class="small">
      Izinkan akses kamera ketika browser meminta izin.
    </div>

  </div>


  <!-- SCANNER -->
  <div class="card" id="scannerCard" style="display:none;">

    <div id="reader"></div>

    <div
      id="status"
      class="status"
    ></div>

    <div
      id="ticketInfo"
      class="ticket-info"
    ></div>

    <button
      type="button"
      id="scanAgainButton"
      class="btn-scan-again"
      onclick="scanLagi()"
    >
      🔄 SCAN LAGI
    </button>

  </div>


  <div class="footer">
    Sistem Check-In Misa
  </div>

</div>


<script>

  /*
   * =========================================================
   * URL GOOGLE APPS SCRIPT
   * =========================================================
   */

  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


  /*
   * =========================================================
   * VARIABLE
   * =========================================================
   */

  let html5QrCode = null;

  let scannerAktif = false;

  let sedangMemproses = false;

  let petugasAktif = "";


  /*
   * =========================================================
   * MULAI SCANNER
   * =========================================================
   */

  function mulaiScanner() {

    const petugasInput =
      document.getElementById("petugas");

    const petugas =
      petugasInput.value.trim();

    if (!petugas) {

      alert("Silakan isi nama petugas terlebih dahulu.");

      petugasInput.focus();

      return;
    }

    petugasAktif = petugas;

    document.getElementById("scannerCard").style.display =
      "block";

    document.getElementById("scanAgainButton").style.display =
      "none";

    resetStatus();

    mulaiKamera();

  }


  /*
   * =========================================================
   * MULAI KAMERA
   * =========================================================
   */

  function mulaiKamera() {

    if (scannerAktif) {
      return;
    }

    html5QrCode =
      new Html5Qrcode("reader");

    const config = {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    };

    html5QrCode
      .start(
        {
          facingMode: "environment"
        },
        config,
        onScanSuccess,
        onScanFailure
      )
      .then(function() {

        scannerAktif = true;

      })
      .catch(function(error) {

        scannerAktif = false;

        tampilkanError(
          "❌ KAMERA TIDAK DAPAT DIBUKA",
          "Pastikan browser sudah diberi izin menggunakan kamera."
        );

        console.error(error);

      });

  }


  /*
   * =========================================================
   * KETIKA QR BERHASIL DIBACA
   * =========================================================
   */

  function onScanSuccess(
    decodedText,
    decodedResult
  ) {

    if (sedangMemproses) {
      return;
    }

    sedangMemproses = true;

    hentikanScanner();

    const idRegistrasi =
      ambilIDRegistrasi(decodedText);

    if (!idRegistrasi) {

      tampilkanError(
        "❌ QR TIDAK VALID",
        "QR Code tidak berisi ID registrasi yang dapat diproses."
      );

      document.getElementById("scanAgainButton").style.display =
        "block";

      sedangMemproses = false;

      return;
    }

    tampilkanChecking();

    prosesCheckIn(
      idRegistrasi,
      petugasAktif
    );

  }


  /*
   * =========================================================
   * JIKA QR GAGAL DIBACA
   * =========================================================
   */

  function onScanFailure(errorMessage) {

    // Sengaja dikosongkan.
    // Scanner akan terus mencoba membaca QR.
  }


  /*
   * =========================================================
   * AMBIL ID REGISTRASI DARI QR
   * =========================================================
   */

  function ambilIDRegistrasi(text) {

    if (!text) {
      return "";
    }

    text = text.trim();

    /*
     * Kasus 1:
     * QR langsung berisi ID_REGISTRASI
     *
     * Contoh:
     * REG-20261224-001
     */

    if (
      text.indexOf("REG-") === 0
    ) {

      return text;

    }


    /*
     * Kasus 2:
     * QR berisi URL e-ticket
     *
     * Contoh:
     * https://script.google.com/...?...id=REG-...
     */

    try {

      const url =
        new URL(text);

      const id =
        url.searchParams.get("id");

      if (id) {
        return id;
      }

      const idRegistrasi =
        url.searchParams.get("id_registrasi");

      if (idRegistrasi) {
        return idRegistrasi;
      }

    } catch (error) {

      // Bukan URL.
    }


    /*
     * Kasus 3:
     * QR berisi JSON
     */

    try {

      const data =
        JSON.parse(text);

      if (
        data.ID_REGISTRASI
      ) {

        return String(
          data.ID_REGISTRASI
        ).trim();

      }

      if (
        data.id_registrasi
      ) {

        return String(
          data.id_registrasi
        ).trim();

      }

      if (
        data.id
      ) {

        return String(
          data.id
        ).trim();

      }

    } catch (error) {

      // Bukan JSON.
    }


    /*
     * Kalau tetap tidak ditemukan,
     * coba cari pola REG-...
     */

    const match =
      text.match(
        /REG-[A-Za-z0-9_-]+/i
      );

    if (match) {
      return match[0];
    }


    return "";

  }


  /*
   * =========================================================
   * PROSES CHECK-IN KE APPS SCRIPT
   * =========================================================
   */

  function prosesCheckIn(
    idRegistrasi,
    petugas
  ) {

    const callbackName =
      "checkInCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );

    const script =
      document.createElement("script");

    const timeout =
      setTimeout(function() {

        cleanupJsonp(
          script,
          callbackName
        );

        tampilkanError(
          "❌ SERVER CHECK-IN TIDAK DAPAT DIHUBUNGI",
          "Periksa koneksi internet atau pastikan Google Apps Script Web App sudah dideploy sebagai versi terbaru."
        );

        document.getElementById(
          "scanAgainButton"
        ).style.display = "block";

        sedangMemproses = false;

      }, 15000);


    window[callbackName] =
      function(response) {

        clearTimeout(timeout);

        cleanupJsonp(
          script,
          callbackName
        );

        prosesHasilCheckIn(
          response
        );

      };


    const url =
      APPS_SCRIPT_URL +
      "?action=checkin" +
      "&id=" +
      encodeURIComponent(
        idRegistrasi
      ) +
      "&petugas=" +
      encodeURIComponent(
        petugas
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      ) +
      "&_=" +
      Date.now();


    script.src = url;

    script.onerror =
      function() {

        clearTimeout(timeout);

        cleanupJsonp(
          script,
          callbackName
        );

        tampilkanError(
          "❌ SERVER CHECK-IN TIDAK DAPAT DIHUBUNGI",
          "Google Apps Script tidak dapat diakses."
        );

        document.getElementById(
          "scanAgainButton"
        ).style.display = "block";

        sedangMemproses = false;

      };


    document.body.appendChild(
      script
    );

  }


  /*
   * =========================================================
   * CLEANUP JSONP
   * =========================================================
   */

  function cleanupJsonp(
    script,
    callbackName
  ) {

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

    try {

      delete window[
        callbackName
      ];

    } catch (error) {

      window[
        callbackName
      ] = undefined;

    }

  }


  /*
   * =========================================================
   * HASIL CHECK-IN
   * =========================================================
   */

  function prosesHasilCheckIn(
    response
  ) {

    console.log(
      "Response check-in:",
      response
    );


    if (!response) {

      tampilkanError(
        "❌ SERVER TIDAK MEMBERIKAN RESPONSE",
        "Silakan coba scan kembali."
      );

      document.getElementById(
        "scanAgainButton"
      ).style.display = "block";

      sedangMemproses = false;

      return;
    }


    /*
     * BERHASIL CHECK-IN
     */

    if (
      response.success === true
    ) {

      tampilkanSukses(
        response
      );

      document.getElementById(
        "scanAgainButton"
      ).style.display = "block";

      sedangMemproses = false;

      return;
    }


    /*
     * SUDAH CHECK-IN SEBELUMNYA
     */

    if (
      response.alreadyCheckedIn === true
    ) {

      tampilkanSudahCheckIn(
        response
      );

      document.getElementById(
        "scanAgainButton"
      ).style.display = "block";

      sedangMemproses = false;

      return;
    }


    /*
     * ERROR LAIN
     */

    tampilkanError(
      "❌ TIDAK DAPAT CHECK-IN",
      response.message ||
      "Terjadi kesalahan saat memproses tiket."
    );

    document.getElementById(
      "scanAgainButton"
    ).style.display = "block";

    sedangMemproses = false;

  }


  /*
   * =========================================================
   * STATUS: MEMERIKSA
   * =========================================================
   */

  function tampilkanChecking() {

    const status =
      document.getElementById(
        "status"
      );

    status.className =
      "status checking";

    status.innerHTML =
      "⏳ MEMERIKSA TIKET...";

    status.style.display =
      "block";

    document.getElementById(
      "ticketInfo"
    ).style.display = "none";

  }


  /*
   * =========================================================
   * STATUS: BERHASIL
   * =========================================================
   */

  function tampilkanSukses(
    response
  ) {

    const status =
      document.getElementById(
        "status"
      );

    status.className =
      "status success";

    status.innerHTML =
      "✅ TERDAFTAR<br>" +
      "<span style='font-size:14px;font-weight:normal;'>" +
      escapeHtml(
        response.message ||
        "Check-in berhasil."
      ) +
      "</span>";

    status.style.display =
      "block";


    tampilkanInfoTiket(
      response
    );

  }


  /*
   * =========================================================
   * STATUS: SUDAH CHECK-IN
   * =========================================================
   */

  function tampilkanSudahCheckIn(
    response
  ) {

    const status =
      document.getElementById(
        "status"
      );

    status.className =
      "status warning";

    status.innerHTML =
      "⚠️ SUDAH CHECK-IN<br>" +
      "<span style='font-size:14px;font-weight:normal;'>" +
      escapeHtml(
        response.message ||
        "Tiket ini sudah pernah digunakan untuk check-in."
      ) +
      "</span>";

    status.style.display =
      "block";


    tampilkanInfoTiket(
      response
    );

  }


  /*
   * =========================================================
   * STATUS: ERROR
   * =========================================================
   */

  function tampilkanError(
    judul,
    pesan
  ) {

    const status =
      document.getElementById(
        "status"
      );

    status.className =
      "status error";

    status.innerHTML =
      judul +
      "<br>" +
      "<span style='font-size:14px;font-weight:normal;'>" +
      escapeHtml(
        pesan
      ) +
      "</span>";

    status.style.display =
      "block";

    document.getElementById(
      "ticketInfo"
    ).style.display = "none";

  }


  /*
   * =========================================================
   * INFO TIKET
   * =========================================================
   */

  function tampilkanInfoTiket(
    response
  ) {

    const info =
      document.getElementById(
        "ticketInfo"
      );


    let html = "";


    if (
      response.nama
    ) {

      html +=
        "<div><strong>Nama:</strong> " +
        escapeHtml(
          response.nama
        ) +
        "</div>";

    }


    if (
      response.idRegistrasi
    ) {

      html +=
        "<div><strong>ID Registrasi:</strong> " +
        escapeHtml(
          response.idRegistrasi
        ) +
        "</div>";

    }


    if (
      response.idMisa
    ) {

      html +=
        "<div><strong>ID Misa:</strong> " +
        escapeHtml(
          response.idMisa
        ) +
        "</div>";

    }


    if (
      response.waktuCheckIn
    ) {

      html +=
        "<div><strong>Waktu Check-In:</strong> " +
        escapeHtml(
          response.waktuCheckIn
        ) +
        "</div>";

    }


    if (
      response.petugas
    ) {

      html +=
        "<div><strong>Petugas:</strong> " +
        escapeHtml(
          response.petugas
        ) +
        "</div>";

    }


    if (html) {

      info.innerHTML =
        html;

      info.style.display =
        "block";

    } else {

      info.style.display =
        "none";

    }

  }


  /*
   * =========================================================
   * SCAN LAGI
   * =========================================================
   */

  function scanLagi() {

    sedangMemproses = false;

    resetStatus();

    document.getElementById(
      "scanAgainButton"
    ).style.display = "none";

    mulaiKamera();

  }


  /*
   * =========================================================
   * HENTIKAN SCANNER
   * =========================================================
   */

  function hentikanScanner() {

    if (
      html5QrCode &&
      scannerAktif
    ) {

      html5QrCode
        .stop()
        .then(function() {

          scannerAktif = false;

        })
        .catch(function(error) {

          console.error(
            "Gagal menghentikan scanner:",
            error
          );

          scannerAktif = false;

        });

    }

  }


  /*
   * =========================================================
   * RESET STATUS
   * =========================================================
   */

  function resetStatus() {

    const status =
      document.getElementById(
        "status"
      );

    status.style.display =
      "none";

    status.innerHTML =
      "";

    status.className =
      "status";


    const info =
      document.getElementById(
        "ticketInfo"
      );

    info.style.display =
      "none";

    info.innerHTML =
      "";

  }


  /*
   * =========================================================
   * ESCAPE HTML
   * =========================================================
   */

  function escapeHtml(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }

    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /*
   * =========================================================
   * SAAT HALAMAN DITUTUP / PINDAH
   * =========================================================
   */

  window.addEventListener(
    "beforeunload",
    function() {

      hentikanScanner();

    }
  );

</script>

</body>
</html>

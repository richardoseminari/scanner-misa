<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Check-In Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .box {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      background: #2563eb;
      color: white;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #btnStop {
      background: #dc2626;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      background: #f3f4f6;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .info {
      background: #dbeafe !important;
      color: #1e40af;
    }

    .warning {
      background: #fef3c7 !important;
      color: #92400e;
    }

    .hidden {
      display: none !important;
    }

    .ticket {
      margin-top: 12px;
      padding: 15px;
      border-radius: 10px;
      background: #f9fafb;
      text-align: left;
    }

    .ticket-row {
      margin: 6px 0;
    }

    .ticket-label {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Scanner Check-In Misa</h2>

  <label for="petugas">
    Nama Petugas
  </label>

  <input
    type="text"
    id="petugas"
    placeholder="Masukkan nama petugas"
    autocomplete="off"
  >

  <button
    id="btnStart"
    type="button"
    onclick="mulaiScanner()"
  >
    Mulai Scanner
  </button>

  <button
    id="btnStop"
    type="button"
    onclick="stopScanner()"
    class="hidden"
  >
    Hentikan Scanner
  </button>

  <div id="reader"></div>

  <div id="status">
    Scanner belum dimulai.
  </div>

</div>


<script>

const API =
  "https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


let scanner = null;
let aktif = false;
let sedangProses = false;
let bridgeFrame = null;
let bridgeTimeout = null;


/* =========================================================
   STATUS
========================================================= */

function status(pesan, tipe) {

  const el = document.getElementById("status");

  el.className = "";

  if (tipe === "success") {
    el.classList.add("success");
  }

  if (tipe === "error") {
    el.classList.add("error");
  }

  if (tipe === "info") {
    el.classList.add("info");
  }

  if (tipe === "warning") {
    el.classList.add("warning");
  }

  el.innerHTML = pesan;
}


/* =========================================================
   MULAI SCANNER
========================================================= */

async function mulaiScanner() {

  if (aktif) {
    return;
  }

  const petugas =
    document.getElementById("petugas").value.trim();

  if (!petugas) {

    status(
      "<b>Nama petugas wajib diisi.</b>",
      "error"
    );

    document.getElementById("petugas").focus();

    return;
  }


  status(
    "Meminta izin kamera...",
    "info"
  );


  try {

    /*
      Tes permission kamera terlebih dahulu.
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });


    /*
      Setelah permission diberikan,
      matikan stream sementara.
      html5-qrcode akan membuka kamera sendiri.
    */

    stream.getTracks().forEach(function(track) {
      track.stop();
    });


    scanner =
      new Html5Qrcode("reader");


    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const ukuran =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.70;

          return {
            width: ukuran,
            height: ukuran
          };

        },

        aspectRatio: 1.0
      },

      qrBerhasil,

      function(errorMessage) {
        /*
          Error scan biasa diabaikan.
          Kamera tetap berjalan.
        */
      }

    );


    aktif = true;

    document
      .getElementById("btnStart")
      .classList.add("hidden");

    document
      .getElementById("btnStop")
      .classList.remove("hidden");

    status(
      "<b>Scanner aktif.</b><br>Arahkan kamera ke QR tiket.",
      "success"
    );

  }

  catch (error) {

    console.error(error);

    status(
      "<b>Kamera tidak dapat dibuka.</b><br>" +
      "Pastikan izin kamera diberikan kepada browser.",
      "error"
    );

  }

}


/* =========================================================
   QR BERHASIL TERBACA
========================================================= */

function qrBerhasil(decodedText) {

  if (sedangProses) {
    return;
  }

  sedangProses = true;


  const idRegistrasi =
    String(decodedText || "").trim();


  const petugas =
    document.getElementById("petugas").value.trim();


  if (!idRegistrasi) {

    sedangProses = false;

    return;
  }


  if (!petugas) {

    sedangProses = false;

    status(
      "<b>Nama petugas belum diisi.</b>",
      "error"
    );

    return;
  }


  status(
    "<b>QR TERBACA</b><br>" +
    "Memeriksa tiket...",
    "info"
  );


  prosesCheckIn(
    idRegistrasi,
    petugas
  );

}


/* =========================================================
   CHECK-IN MELALUI BRIDGE
========================================================= */

function prosesCheckIn(
  idRegistrasi,
  petugas
) {

  /*
    Hapus bridge sebelumnya jika masih ada.
  */

  hapusBridge();


  /*
    Membuat nomor acak untuk memastikan
    response yang diterima adalah milik
    request ini.
  */

  const nonce =
    Date.now().toString() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2);


  /*
    URL Bridge Apps Script.
  */

  const url =
    API +
    "?page=bridge" +
    "&id=" +
    encodeURIComponent(idRegistrasi) +
    "&petugas=" +
    encodeURIComponent(petugas) +
    "&target=" +
    encodeURIComponent(window.location.origin) +
    "&nonce=" +
    encodeURIComponent(nonce);


  /*
    Buat iframe tersembunyi.
  */

  bridgeFrame =
    document.createElement("iframe");


  bridgeFrame.style.position = "fixed";
  bridgeFrame.style.width = "1px";
  bridgeFrame.style.height = "1px";
  bridgeFrame.style.border = "0";
  bridgeFrame.style.opacity = "0";
  bridgeFrame.style.pointerEvents = "none";

  bridgeFrame.src = url;


  document.body.appendChild(
    bridgeFrame
  );


  /*
    Timeout.
    Kalau dalam 20 detik tidak ada response,
    tampilkan error.
  */

  bridgeTimeout =
    setTimeout(function() {

      hapusBridge();

      sedangProses = false;

      status(
        "<b>SERVER TIDAK MERESPONS</b><br>" +
        "Tidak menerima jawaban dari server Check-In.<br>" +
        "Periksa koneksi internet lalu coba scan kembali.",
        "error"
      );

    }, 20000);

}


/* =========================================================
   MENERIMA HASIL DARI BRIDGE
========================================================= */

function menerimaHasilBridge(event) {

  const data =
    event.data;


  /*
    Pastikan pesan memang berasal
    dari Bridge kita.
  */

  if (!data) {
    return;
  }


  if (data.type !== "MISA_CHECKIN_RESULT") {
    return;
  }


  /*
    Pastikan berasal dari iframe Bridge
    yang sedang aktif.
  */

  if (
    bridgeFrame &&
    event.source !== bridgeFrame.contentWindow
  ) {

    return;

  }


  /*
    Bersihkan timeout.
  */

  if (bridgeTimeout) {

    clearTimeout(
      bridgeTimeout
    );

    bridgeTimeout = null;

  }


  /*
    Hapus iframe.
  */

  hapusBridge();


  const hasil =
    data.data || {};


  tampilkanHasil(
    hasil
  );

}


/* =========================================================
   TAMPILKAN HASIL CHECK-IN
========================================================= */

function tampilkanHasil(hasil) {

  if (hasil.success) {

    let html =
      "<b>CHECK-IN BERHASIL</b>";

    if (hasil.nama) {

      html +=
        "<div class='ticket'>" +

        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Nama:</span> " +
        escapeHtml(hasil.nama) +
        "</div>";

    }


    if (hasil.namaMisa) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Misa:</span> " +
        escapeHtml(hasil.namaMisa) +
        "</div>";

    }


    if (hasil.tanggal) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Tanggal:</span> " +
        escapeHtml(hasil.tanggal) +
        "</div>";

    }


    if (hasil.jam) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Jam:</span> " +
        escapeHtml(hasil.jam) +
        "</div>";

    }


    if (hasil.jumlah !== undefined) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Jumlah:</span> " +
        escapeHtml(String(hasil.jumlah)) +
        "</div>";

    }


    if (hasil.waktuCheckIn) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Check-In:</span> " +
        escapeHtml(hasil.waktuCheckIn) +
        "</div>";

    }


    html += "</div>";


    status(
      html,
      "success"
    );

  }

  else if (hasil.alreadyCheckedIn) {

    let html =
      "<b>TIKET SUDAH CHECK-IN</b>";


    if (hasil.nama) {

      html +=
        "<div class='ticket'>" +

        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Nama:</span> " +
        escapeHtml(hasil.nama) +
        "</div>";

    }


    if (hasil.namaMisa) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Misa:</span> " +
        escapeHtml(hasil.namaMisa) +
        "</div>";

    }


    if (hasil.waktuCheckIn) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Check-In sebelumnya:</span> " +
        escapeHtml(hasil.waktuCheckIn) +
        "</div>";

    }


    if (hasil.petugasSebelumnya) {

      html +=
        "<div class='ticket-row'>" +
        "<span class='ticket-label'>Petugas:</span> " +
        escapeHtml(hasil.petugasSebelumnya) +
        "</div>";

    }


    html += "</div>";


    status(
      html,
      "warning"
    );

  }

  else {

    status(
      "<b>CHECK-IN DITOLAK</b><br><br>" +
      escapeHtml(
        hasil.message ||
        "Tiket tidak dapat diproses."
      ),
      "error"
    );

  }


  /*
    Beri waktu sebentar sebelum scanner
    menerima QR berikutnya.
  */

  setTimeout(function() {

    sedangProses = false;

  }, 1500);

}


/* =========================================================
   HAPUS BRIDGE
========================================================= */

function hapusBridge() {

  if (bridgeTimeout) {

    clearTimeout(
      bridgeTimeout
    );

    bridgeTimeout = null;

  }


  if (bridgeFrame) {

    try {

      bridgeFrame.src =
        "about:blank";

    } catch (e) {}

    try {

      bridgeFrame.remove();

    } catch (e) {}

    bridgeFrame = null;

  }

}


/* =========================================================
   HENTIKAN SCANNER
========================================================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      aktif
    ) {

      await scanner.stop();

      scanner.clear();

    }

  }

  catch (error) {

    console.error(error);

  }


  scanner = null;
  aktif = false;
  sedangProses = false;


  hapusBridge();


  document
    .getElementById("btnStart")
    .classList.remove("hidden");


  document
    .getElementById("btnStop")
    .classList.add("hidden");


  status(
    "Scanner dihentikan.",
    "info"
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   LISTENER BRIDGE
========================================================= */

window.addEventListener(
  "message",
  menerimaHasilBridge,
  false
);


/* =========================================================
   BERSIHKAN SAAT HALAMAN DITUTUP
========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    hapusBridge();

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Check-In Misa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #202124;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  background: #17365d;
  color: white;
  padding: 22px 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  text-align: center;
}

.header h1 {
  margin: 0 0 6px;
  font-size: 24px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d7de;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #17365d;
}

button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.btn-primary {
  background: #17365d;
  color: white;
}

.btn-secondary {
  background: #e9eef5;
  color: #17365d;
}

.btn-danger {
  background: #c62828;
  color: white;
}

.status {
  padding: 14px;
  border-radius: 12px;
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
}

.status.info {
  display: block;
  background: #e8f1fb;
  color: #17365d;
}

.status.success {
  display: block;
  background: #e8f5e9;
  color: #1b5e20;
}

.status.error {
  display: block;
  background: #ffebee;
  color: #b71c1c;
}

.status.warning {
  display: block;
  background: #fff8e1;
  color: #8d6e00;
}

.hidden {
  display: none !important;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 15px;
  background: #111;
}

.petugas-info {
  background: #eef3f8;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.petugas-info small {
  display: block;
  color: #777;
  margin-bottom: 4px;
}

.petugas-info strong {
  color: #17365d;
  font-size: 16px;
}

.loading {
  text-align: center;
  padding: 15px;
  display: none;
  font-weight: bold;
}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>📷 Check-In Misa</h1>

    <p>Scan QR Code tiket umat</p>

  </div>


  <!-- PETUGAS -->

  <div
    class="card"
    id="petugasCard"
  >

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      type="text"
      id="petugas"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >

    <button
      type="button"
      class="btn-primary"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>

    <button
      type="button"
      class="btn-secondary"
      onclick="hapusPetugas()"
    >
      Ganti Petugas
    </button>

    <div
      id="statusAwal"
      class="status"
    ></div>

  </div>


  <!-- SCANNER -->

  <div
    class="card hidden"
    id="scannerCard"
  >

    <div class="petugas-info">

      <small>Petugas aktif</small>

      <strong id="namaPetugasAktif">
        -
      </strong>

    </div>


    <h3 style="margin-top:0;">
      Arahkan kamera ke QR tiket
    </h3>


    <div id="reader"></div>


    <div
      id="scannerStatus"
      class="status info"
    >
      Membuka kamera...
    </div>


    <button
      type="button"
      class="btn-danger"
      onclick="tutupKamera()"
    >
      ✕ Tutup Kamera
    </button>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >
    ⏳ Membuka halaman check-in...
  </div>


</div>



<script>


/* =====================================================
   APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
"misa_petugas";


/* =====================================================
   VARIABLE
===================================================== */

let html5QrCode = null;

let scannerAktif = false;

let sedangMemproses = false;

let sedangMembukaKamera = false;


/* =====================================================
   SAAT HALAMAN DIBUKA
===================================================== */

window.addEventListener(
  "load",
  function() {

    const petugas =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (petugas) {

      document
        .getElementById("petugas")
        .value = petugas;


      tampilStatus(
        "statusAwal",
        "Petugas tersimpan. Klik Mulai Scanner.",
        "info"
      );

    }

    else {

      tampilStatus(
        "statusAwal",
        "Masukkan nama petugas terlebih dahulu.",
        "info"
      );

    }

  }
);


/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner() {

  if (sedangMembukaKamera) {
    return;
  }


  if (scannerAktif) {
    return;
  }


  const input =
    document
      .getElementById("petugas");


  const petugas =
    input.value.trim();


  if (!petugas) {

    tampilStatus(
      "statusAwal",
      "Masukkan nama petugas terlebih dahulu.",
      "warning"
    );

    input.focus();

    return;

  }


  /*
    SIMPAN NAMA PETUGAS
  */

  localStorage.setItem(
    STORAGE_KEY,
    petugas
  );


  sedangMembukaKamera = true;


  try {

    /*
      Tampilkan scanner
    */

    document
      .getElementById("petugasCard")
      .classList
      .add("hidden");


    document
      .getElementById("scannerCard")
      .classList
      .remove("hidden");


    document
      .getElementById("namaPetugasAktif")
      .textContent =
      petugas;


    tampilStatus(
      "scannerStatus",
      "Membuka kamera...",
      "info"
    );


    /*
      Bersihkan instance lama
    */

    if (html5QrCode) {

      try {

        if (scannerAktif) {
          await html5QrCode.stop();
        }

      }

      catch (e) {}

      try {
        html5QrCode.clear();
      }

      catch (e) {}

      html5QrCode = null;

      scannerAktif = false;

    }


    /*
      Bersihkan elemen reader
    */

    document
      .getElementById("reader")
      .innerHTML = "";


    /*
      Jeda kecil agar kamera
      benar-benar dilepas
    */

    await tunggu(300);


    /*
      Buat scanner baru
    */

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox:
        function(
          width,
          height
        ) {

          const min =
            Math.min(
              width,
              height
            );

          const size =
            Math.floor(
              min * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

      aspectRatio: 1.0

    };


    /*
      LANGSUNG BUKA KAMERA
      TANPA getUserMedia TERPISAH
    */

    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerAktif = true;


    tampilStatus(
      "scannerStatus",
      "Kamera aktif. Arahkan QR ke kamera.",
      "info"
    );

  }

  catch (error) {

    console.error(
      "Kamera error:",
      error
    );


    scannerAktif = false;


    try {

      if (html5QrCode) {
        html5QrCode.clear();
      }

    }

    catch (e) {}


    html5QrCode = null;


    document
      .getElementById("scannerCard")
      .classList
      .add("hidden");


    document
      .getElementById("petugasCard")
      .classList
      .remove("hidden");


    let pesan =
      "Kamera tidak dapat digunakan.";


    if (
      error &&
      error.name === "NotAllowedError"
    ) {

      pesan =
        "Akses kamera ditolak. " +
        "Izinkan kamera pada browser.";

    }

    else if (
      error &&
      error.name === "NotFoundError"
    ) {

      pesan =
        "Kamera tidak ditemukan.";

    }

    else if (
      error &&
      error.name === "NotReadableError"
    ) {

      pesan =
        "Kamera sedang digunakan aplikasi lain. " +
        "Tutup aplikasi lain yang menggunakan kamera.";

    }

    else if (
      error &&
      error.message
    ) {

      pesan =
        "Kamera tidak dapat digunakan: " +
        error.message;

    }


    tampilStatus(
      "statusAwal",
      pesan,
      "error"
    );

  }

  finally {

    sedangMembukaKamera = false;

  }

}


/* =====================================================
   QR BERHASIL
===================================================== */

async function onScanSuccess(
  decodedText
) {

  if (sedangMemproses) {
    return;
  }


  sedangMemproses = true;


  const idRegistrasi =
    String(
      decodedText || ""
    ).trim();


  if (!idRegistrasi) {

    sedangMemproses = false;

    return;

  }


  /*
    Tampilkan status seketika
  */

  tampilStatus(
    "scannerStatus",
    "QR terbaca. Memproses check-in...",
    "info"
  );


  /*
    Ambil petugas
  */

  const petugas =
    localStorage.getItem(
      STORAGE_KEY
    ) ||
    document
      .getElementById("petugas")
      .value
      .trim();


  /*
    Stop kamera
  */

  await stopScanner();


  /*
    Loading
  */

  document
    .getElementById("loading")
    .style
    .display = "block";


  /*
    LANGSUNG BUKA APPS SCRIPT
  */

  const url =
    API_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(
      idRegistrasi
    ) +
    "&petugas=" +
    encodeURIComponent(
      petugas
    );


  console.log(
    "CHECK-IN URL:",
    url
  );


  /*
    Beri sedikit waktu agar
    kamera benar-benar berhenti
    sebelum browser pindah halaman.
  */

  await tunggu(150);


  window.location.href =
    url;

}


/* =====================================================
   SCAN GAGAL
===================================================== */

function onScanFailure() {

  /*
    Tidak melakukan apa-apa.
    Scanner tetap aktif.
  */

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

  if (!html5QrCode) {

    scannerAktif = false;

    return;

  }


  try {

    if (scannerAktif) {

      await html5QrCode.stop();

    }

  }

  catch (error) {

    console.log(
      "Stop camera:",
      error
    );

  }


  try {

    html5QrCode.clear();

  }

  catch (error) {}


  html5QrCode = null;

  scannerAktif = false;


  const reader =
    document.getElementById(
      "reader"
    );


  if (reader) {

    reader.innerHTML = "";

  }

}


/* =====================================================
   TUTUP KAMERA MANUAL
===================================================== */

async function tutupKamera() {

  await stopScanner();


  document
    .getElementById("scannerCard")
    .classList
    .add("hidden");


  document
    .getElementById("petugasCard")
    .classList
    .remove("hidden");


  tampilStatus(
    "statusAwal",
    "Kamera ditutup. Nama petugas tetap tersimpan.",
    "info"
  );


  sedangMemproses = false;

}


/* =====================================================
   GANTI PETUGAS
===================================================== */

async function hapusPetugas() {

  await stopScanner();


  localStorage.removeItem(
    STORAGE_KEY
  );


  document
    .getElementById("petugas")
    .value = "";


  document
    .getElementById("scannerCard")
    .classList
    .add("hidden");


  document
    .getElementById("petugasCard")
    .classList
    .remove("hidden");


  tampilStatus(
    "statusAwal",
    "Masukkan nama petugas baru.",
    "info"
  );


  document
    .getElementById("petugas")
    .focus();

}


/* =====================================================
   STATUS
===================================================== */

function tampilStatus(
  id,
  message,
  type
) {

  const el =
    document.getElementById(
      id
    );


  if (!el) {
    return;
  }


  el.className =
    "status";


  if (!message) {

    el.style.display =
      "none";

    el.innerHTML = "";

    return;

  }


  el.classList.add(
    type
  );


  el.textContent =
    message;

}


/* =====================================================
   TUNGGU
===================================================== */

function tunggu(
  ms
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}

</script>


</body>
</html>

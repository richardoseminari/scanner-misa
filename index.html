<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Check-In Misa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #202124;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  background: #17365d;
  color: white;
  padding: 22px 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  text-align: center;
}

.header h1 {
  margin: 0 0 6px;
  font-size: 24px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d7de;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.btn-primary {
  background: #17365d;
  color: white;
}

.btn-danger {
  background: #c62828;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 15px;
  background: #111;
}

.status {
  padding: 14px;
  border-radius: 12px;
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  word-break: break-word;
}

.status.info {
  display: block;
  background: #e8f1fb;
  color: #17365d;
}

.status.success {
  display: block;
  background: #e8f5e9;
  color: #1b5e20;
}

.status.error {
  display: block;
  background: #ffebee;
  color: #b71c1c;
}

.status.warning {
  display: block;
  background: #fff8e1;
  color: #8d6e00;
}

.result {
  display: none;
}

.result h2 {
  margin-top: 0;
}

.data-row {
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.label-small {
  color: #777;
  font-size: 12px;
}

.value {
  font-weight: bold;
  margin-top: 3px;
}

.hidden {
  display: none !important;
}

.loading {
  text-align: center;
  padding: 15px;
  display: none;
  font-weight: bold;
}

.qr-debug {
  margin-top: 10px;
  padding: 10px;
  background: #f1f3f4;
  border-radius: 10px;
  font-size: 12px;
  word-break: break-all;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 Check-In Misa</h1>
    <p>Scan QR Code tiket umat</p>
  </div>


  <div class="card" id="petugasCard">

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      type="text"
      id="petugas"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >

    <button
      type="button"
      class="btn-primary"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>

    <div
      id="statusAwal"
      class="status"
    ></div>

  </div>


  <div
    class="card hidden"
    id="scannerCard"
  >

    <h3 style="margin-top:0;">
      Arahkan kamera ke QR tiket
    </h3>

    <div id="reader"></div>

    <div
      id="scannerStatus"
      class="status info"
    >
      Kamera aktif. Arahkan QR ke kamera.
    </div>

    <div
      id="qrDebug"
      class="qr-debug"
      style="display:none"
    ></div>

    <button
      type="button"
      class="btn-danger"
      onclick="stopScanner()"
    >
      ✕ Tutup Kamera
    </button>

  </div>


  <div
    id="loading"
    class="loading"
  >
    ⏳ Memproses check-in...
  </div>


  <div
    class="card result"
    id="resultCard"
  >

    <h2 id="resultTitle"></h2>

    <div
      id="resultStatus"
      class="status"
    ></div>

    <div id="resultData"></div>

    <button
      type="button"
      class="btn-primary"
      onclick="scanBerikutnya()"
    >
      📷 Scan Tiket Berikutnya
    </button>

  </div>

</div>


<script>


/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


let html5QrCode = null;

let scannerAktif = false;

let sedangMemproses = false;

/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner() {

  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  if (!petugas) {

    tampilStatus(
      "statusAwal",
      "Masukkan nama petugas terlebih dahulu.",
      "warning"
    );

    return;
  }


  if (sedangMemproses) {
    return;
  }


  try {

    tampilStatus(
      "statusAwal",
      "Membuka kamera...",
      "info"
    );


    // Pastikan scanner lama benar-benar sudah dilepas.
    await stopScanner();


    // Beri waktu singkat kepada browser untuk
    // melepaskan kamera sebelum dibuka kembali.
    await tunggu(400);


    document
      .getElementById("petugasCard")
      .classList
      .add("hidden");


    document
      .getElementById("scannerCard")
      .classList
      .remove("hidden");


    // Bersihkan tampilan scanner lama.
    document.getElementById("reader").innerHTML = "";


    html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox:
        function(
          width,
          height
        ) {

          const min =
            Math.min(
              width,
              height
            );

          const size =
            Math.floor(
              min * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

      aspectRatio: 1.0

    };


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerAktif = true;


    tampilStatus(
      "scannerStatus",
      "Kamera aktif. Arahkan QR ke kamera.",
      "info"
    );

  }

  catch (error) {

    console.error(
      "GAGAL MEMBUKA KAMERA:",
      error
    );


    document
      .getElementById("scannerCard")
      .classList
      .add("hidden");


    document
      .getElementById("petugasCard")
      .classList
      .remove("hidden");


    let pesan =
      "Kamera tidak dapat digunakan.";


    if (
      error &&
      error.message
    ) {

      pesan +=
        " " +
        error.message;

    }


    tampilStatus(
      "statusAwal",
      pesan,
      "error"
    );

  }

}


/* =====================================================
   TUNGGU
===================================================== */

function tunggu(ms) {

  return new Promise(
    function(resolve) {
      setTimeout(
        resolve,
        ms
      );
    }
  );

}


/* =====================================================
   QR TERBACA
===================================================== */

async function onScanSuccess(decodedText) {

  if (sedangMemproses) {
    return;
  }

  sedangMemproses = true;

  const idRegistrasi =
    String(decodedText || "").trim();

  const debug =
    document.getElementById("qrDebug");

  debug.style.display = "block";

  debug.innerHTML =
    "<b>QR TERBACA:</b><br>" +
    escapeHTML(idRegistrasi);

  /*
    Buka tab SEBELUM await supaya tidak dianggap popup
    yang dibuka secara terlambat oleh browser HP.
  */
  const hasilTab =
    window.open("about:blank", "_blank");

  await stopScanner();

  document
    .getElementById("scannerCard")
    .classList
    .add("hidden");

  document
    .getElementById("loading")
    .style
    .display = "block";

  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();

  const url =
    API_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(idRegistrasi) +
    "&petugas=" +
    encodeURIComponent(petugas) +
    "&t=" +
    Date.now();

  console.log("URL CHECK-IN:", url);

  if (hasilTab) {

    try {
      hasilTab.location.href = url;
    }

    catch (error) {
      console.error(error);
      window.location.href = url;
    }

    return;
  }

  document
    .getElementById("loading")
    .style
    .display = "none";

  tampilHasil({
    success: false,
    alreadyCheckedIn: false,
    message:
      "Browser memblokir tab hasil check-in."
  });

  tampilkanTombolBukaCheckIn(url);

  sedangMemproses = false;
}


/* =====================================================
   TOMBOL BUKA CHECK-IN MANUAL
===================================================== */

function tampilkanTombolBukaCheckIn(url) {

  const data =
    document.getElementById("resultData");

  const tombol =
    document.createElement("button");

  tombol.type = "button";

  tombol.className = "btn-primary";

  tombol.textContent =
    "➡️ Buka Hasil Check-In";

  tombol.onclick = function() {

    window.open(
      url,
      "_blank"
    );

  };

  data.appendChild(tombol);
}


/* =====================================================
   STOP CAMERA
===================================================== */

async function stopScanner() {

  const scanner =
    html5QrCode;

  html5QrCode = null;

  if (scanner) {

    try {
      await scanner.stop();
    }

    catch (error) {
      console.log("stop:", error);
    }

    try {
      scanner.clear();
    }

    catch (error) {}

  }

  scannerAktif = false;

  const reader =
    document.getElementById("reader");

  if (reader) {
    reader.innerHTML = "";
  }

}


/* =====================================================
   TAMPIL HASIL
===================================================== */

function tampilHasil(
  result
) {

  document
    .getElementById("resultCard")
    .style
    .display = "block";


  const title =
    document.getElementById(
      "resultTitle"
    );


  const status =
    document.getElementById(
      "resultStatus"
    );


  const data =
    document.getElementById(
      "resultData"
    );


  data.innerHTML = "";


  if (
    !result ||
    !result.success
  ) {

    if (
      result &&
      result.alreadyCheckedIn
    ) {

      title.textContent =
        "⚠️ Sudah Check-In";


      tampilStatus(
        "resultStatus",

        result.message ||
        "Tiket sudah digunakan.",

        "warning"
      );

    }

    else {

      title.textContent =
        "❌ Check-In Ditolak";


      tampilStatus(
        "resultStatus",

        result &&
        result.message
          ? result.message
          : "Tiket tidak dapat digunakan.",

        "error"
      );

    }

    return;
  }


  title.textContent =
    "✅ Check-In Berhasil";


  tampilStatus(
    "resultStatus",

    result.message ||
    "Tiket berhasil digunakan.",

    "success"
  );


  tambahData(
    "Nama",
    result.nama
  );


  tambahData(
    "Misa",
    result.namaMisa
  );


  tambahData(
    "Tanggal",
    result.tanggal
  );


  tambahData(
    "Jam",
    result.jam
  );


  tambahData(
    "Jumlah",
    result.jumlah + " umat"
  );


  tambahData(
    "Waktu Check-In",
    result.waktuCheckIn
  );

}


/* =====================================================
   DATA
===================================================== */

function tambahData(
  label,
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return;
  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "data-row";


  div.innerHTML =
    '<div class="label-small">' +
    escapeHTML(label) +
    '</div>' +

    '<div class="value">' +
    escapeHTML(
      String(value)
    ) +
    '</div>';


  document
    .getElementById(
      "resultData"
    )
    .appendChild(div);

}


/* =====================================================
   SCAN BERIKUTNYA
===================================================== */

async function scanBerikutnya() {

  if (sedangMemproses) {
    return;
  }

  document
    .getElementById("resultCard")
    .style
    .display = "none";

  document
    .getElementById("loading")
    .style
    .display = "none";

  document
    .getElementById("qrDebug")
    .style
    .display = "none";

  document
    .getElementById("resultData")
    .innerHTML = "";

  await stopScanner();

  document
    .getElementById("petugasCard")
    .classList
    .remove("hidden");

  await tunggu(500);

  mulaiScanner();

}


/* =====================================================
   STATUS
===================================================== */

function tampilStatus(
  id,
  message,
  type
) {

  const el =
    document.getElementById(id);


  if (!el) {
    return;
  }


  el.className =
    "status";


  if (!message) {

    el.style.display =
      "none";

    el.innerHTML = "";

    return;
  }


  el.classList.add(
    type
  );


  el.innerHTML =
    escapeHTML(
      message
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   TERIMA HASIL DARI TAB APPS SCRIPT
===================================================== */

window.addEventListener(
  "message",
  function(event) {

    const origin =
      String(event.origin || "");

    if (
      origin !== "https://script.google.com" &&
      origin !== "https://script.googleusercontent.com"
    ) {
      return;
    }

    if (
      !event.data ||
      event.data.type !== "MISA_CHECKIN_RESULT"
    ) {
      return;
    }

    console.log(
      "HASIL CHECK-IN DITERIMA:",
      event.data.result
    );

    document
      .getElementById("loading")
      .style
      .display = "none";

    document
      .getElementById("scannerCard")
      .classList
      .add("hidden");

    document
      .getElementById("petugasCard")
      .classList
      .add("hidden");

    tampilHasil(
      event.data.result
    );

    sedangMemproses = false;

  }
);


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(
  "load",
  function() {

    if (!window.isSecureContext) {

      tampilStatus(
        "statusAwal",
        "Halaman scanner harus dibuka melalui HTTPS.",
        "error"
      );

      return;
    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      tampilStatus(
        "statusAwal",
        "Browser ini tidak mendukung akses kamera.",
        "error"
      );

      return;
    }


    tampilStatus(
      "statusAwal",
      "Kamera siap. Masukkan nama petugas lalu mulai scanner.",
      "info"
    );

  }
);

</script>

</body>
</html>

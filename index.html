<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <meta name="theme-color" content="#17365d">

  <title>Tes Kamera - Scanner Misa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #202124;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: min(520px, 100%);
      margin: auto;
      padding: 18px 14px 32px;
    }

    .head {
      background: #17365d;
      color: white;
      border-radius: 18px;
      padding: 20px 16px;
      text-align: center;
    }

    .head h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .head p {
      margin: 0;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-top: 14px;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.08);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #17365d;
      color: white;
      margin-top: 10px;
    }

    button.secondary {
      background: #68737d;
    }

    video {
      width: 100%;
      display: none;
      margin-top: 14px;
      border-radius: 14px;
      background: #111;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .status {
      margin-top: 14px;
      padding: 13px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .info {
      background: #e8f1fb;
      color: #17365d;
    }

    .ok {
      background: #e8f7ed;
      color: #176b36;
    }

    .error {
      background: #ffe9ed;
      color: #a51d32;
    }

    .small {
      font-size: 13px;
      color: #59636e;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="head">
      <h1>📷 Tes Kamera</h1>
      <p>Scanner Misa • Pengujian Kamera</p>
    </div>

    <div class="card">

      <div id="status" class="status info">
        Tekan tombol di bawah untuk menguji kamera belakang HP.
      </div>

      <button id="startBtn" type="button">
        📷 Tes Kamera
      </button>

      <button
        id="stopBtn"
        type="button"
        class="secondary"
        style="display:none;"
      >
        ✕ Matikan Kamera
      </button>

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <div class="small" style="margin-top:14px;">
        Halaman ini hanya menguji akses kamera.
        Belum ada proses QR atau check-in.
      </div>

    </div>

  </div>


<script>

const statusBox = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const video = document.getElementById("video");

let stream = null;


/* =========================
   TAMPILKAN STATUS
========================= */

function showStatus(type, message) {

  statusBox.className = "status " + type;

  statusBox.textContent = message;

}


/* =========================
   MATIKAN KAMERA
========================= */

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(function(track) {

      track.stop();

    });

    stream = null;

  }

  video.srcObject = null;

  video.style.display = "none";

  stopBtn.style.display = "none";

  startBtn.style.display = "block";

}


/* =========================
   TES KAMERA
========================= */

async function testCamera() {

  showStatus(
    "info",
    "Meminta akses kamera..."
  );


  /* CEK HTTPS */

  if (!window.isSecureContext) {

    showStatus(
      "error",
      "KAMERA GAGAL DIBUKA ❌\n\n" +
      "Halaman ini tidak dianggap aman (HTTPS).\n\n" +
      "Alamat halaman:\n" +
      location.href
    );

    return;

  }


  /* CEK API KAMERA */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showStatus(
      "error",
      "KAMERA GAGAL DIBUKA ❌\n\n" +
      "Browser ini tidak menyediakan akses kamera " +
      "getUserMedia().\n\n" +
      "Browser:\n" +
      navigator.userAgent
    );

    return;

  }


  /* MINTA KAMERA */

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: {
          ideal: "environment"
        },

        width: {
          ideal: 1280
        },

        height: {
          ideal: 720
        }

      },

      audio: false

    });


    /* TAMPILKAN VIDEO */

    video.srcObject = stream;

    video.style.display = "block";

    stopBtn.style.display = "block";

    startBtn.style.display = "none";


    /* INFORMASI KAMERA */

    const tracks = stream.getVideoTracks();

    const track = tracks.length
      ? tracks[0]
      : null;

    const settings = track
      ? track.getSettings()
      : {};


    showStatus(

      "ok",

      "KAMERA BERHASIL DIBUKA ✅\n\n" +

      "Artinya HP + browser + HTTPS " +
      "dapat mengakses kamera.\n\n" +

      "Nama kamera:\n" +
      (track && track.label
        ? track.label
        : "Tidak diketahui") +

      "\n\nResolusi:\n" +

      (settings.width || "?") +
      " × " +
      (settings.height || "?")

    );

  }


  /* =========================
     JIKA ERROR
  ========================= */

  catch (err) {

    let explanation = "";


    switch (err.name) {

      case "NotAllowedError":

        explanation =
          "Browser menolak izin kamera. " +
          "Periksa izin kamera untuk website ini.";

        break;


      case "NotFoundError":

        explanation =
          "Browser tidak menemukan kamera " +
          "yang tersedia.";

        break;


      case "NotReadableError":

        explanation =
          "Kamera tersedia tetapi sedang digunakan " +
          "aplikasi lain atau tidak dapat dibaca.";

        break;


      case "OverconstrainedError":

        explanation =
          "Konfigurasi kamera yang diminta " +
          "tidak tersedia.";

        break;


      case "SecurityError":

        explanation =
          "Browser memblokir akses kamera " +
          "karena alasan keamanan.";

        break;


      case "AbortError":

        explanation =
          "Permintaan kamera dibatalkan oleh " +
          "browser atau perangkat.";

        break;


      case "TypeError":

        explanation =
          "Konfigurasi permintaan kamera tidak valid " +
          "atau Media API tidak tersedia.";

        break;


      default:

        explanation =
          "Browser mengembalikan error kamera " +
          "yang belum dikenali.";

    }


    showStatus(

      "error",

      "KAMERA GAGAL DIBUKA ❌\n\n" +

      "Jenis error:\n" +
      err.name +

      "\n\nPesan browser:\n" +
      (err.message || "(tidak ada pesan)") +

      "\n\nPenjelasan:\n" +
      explanation +

      "\n\nHTTPS:\n" +
      (window.isSecureContext
        ? "YA"
        : "TIDAK") +

      "\n\nBrowser:\n" +
      navigator.userAgent

    );

  }

}


/* =========================
   TOMBOL
========================= */

startBtn.addEventListener(
  "click",
  testCamera
);


stopBtn.addEventListener(
  "click",
  stopCamera
);


/* =========================
   SAAT HALAMAN DITINGGALKAN
========================= */

window.addEventListener(
  "pagehide",
  stopCamera
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Check-In</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 10px;
      word-break: break-word;
    }
  </style>
</head>

<body>

<h2>🧪 Test Check-In</h2>

<p>
Masukkan ID_REGISTRASI yang sudah ada.
</p>

<input
  id="id"
  value="REG-UND5UM9KXV"
  placeholder="REG-xxxxxxxx"
/>

<input
  id="petugas"
  value="TEST"
  placeholder="Nama petugas"
/>

<button onclick="testCheckIn()">
  TEST CHECK-IN
</button>

<div id="hasil">
  Belum ada hasil.
</div>


<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


/*
 * CALLBACK TETAP
 *
 * Tidak dibuat secara random.
 * Ini sengaja supaya kita menghilangkan
 * kemungkinan masalah nama callback.
 */

function checkInCallback(response) {

  console.log(
    "RESPON APPS SCRIPT:",
    response
  );

  document.getElementById("hasil").innerHTML =
    "<b>✅ APPS SCRIPT TERHUBUNG</b><br><br>" +
    "<pre>" +
    escapeHtml(
      JSON.stringify(
        response,
        null,
        2
      )
    ) +
    "</pre>";
}


function testCheckIn() {

  const id =
    document.getElementById("id")
    .value
    .trim();

  const petugas =
    document.getElementById("petugas")
    .value
    .trim();


  if (!id) {

    alert("ID registrasi belum diisi.");

    return;
  }


  document.getElementById("hasil").innerHTML =
    "⏳ Menghubungi Google Apps Script...";


  const script =
    document.createElement("script");


  const url =
    APPS_SCRIPT_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(id) +
    "&petugas=" +
    encodeURIComponent(petugas) +
    "&callback=checkInCallback" +
    "&_=" +
    Date.now();


  console.log(
    "URL:",
    url
  );


  script.src = url;


  script.onload =
    function() {

      console.log(
        "Script Apps Script berhasil dimuat."
      );

    };


  script.onerror =
    function(error) {

      console.error(
        "SCRIPT ERROR:",
        error
      );

      document.getElementById("hasil").innerHTML =
        "<b>❌ SCRIPT TIDAK BERHASIL DIMUAT</b><br><br>" +
        "Browser berhasil membuka GitHub Pages, " +
        "tetapi gagal menjalankan respons Google Apps Script.<br><br>" +
        "<small>" +
        escapeHtml(url) +
        "</small>";

    };


  document.body.appendChild(
    script
  );
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>

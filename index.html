<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1"
>

<title>Check-In Misa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #202124;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  background: #17365d;
  color: white;
  padding: 22px 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  text-align: center;
}

.header h1 {
  margin: 0 0 6px;
  font-size: 24px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d7de;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #17365d;
}

button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.btn-primary {
  background: #17365d;
  color: white;
}

.btn-secondary {
  background: #e9eef5;
  color: #17365d;
}

.btn-danger {
  background: #c62828;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 15px;
  background: #111;
}

.status {
  padding: 14px;
  border-radius: 12px;
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  word-break: break-word;
}

.status.info {
  display: block;
  background: #e8f1fb;
  color: #17365d;
}

.status.success {
  display: block;
  background: #e8f5e9;
  color: #1b5e20;
}

.status.error {
  display: block;
  background: #ffebee;
  color: #b71c1c;
}

.status.warning {
  display: block;
  background: #fff8e1;
  color: #8d6e00;
}

.hidden {
  display: none !important;
}

.result {
  display: none;
}

.result h2 {
  margin-top: 0;
}

.data-row {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.label-small {
  color: #777;
  font-size: 12px;
}

.value {
  font-weight: bold;
  margin-top: 3px;
}

.petugas-info {
  background: #eef3f8;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.petugas-info small {
  color: #666;
  display: block;
  margin-bottom: 3px;
}

.petugas-info strong {
  color: #17365d;
  font-size: 16px;
}

.loading {
  text-align: center;
  padding: 15px;
  display: none;
  font-weight: bold;
}

.qr-debug {
  margin-top: 10px;
  padding: 10px;
  background: #f1f3f4;
  border-radius: 10px;
  font-size: 12px;
  word-break: break-all;
}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>📷 Check-In Misa</h1>

    <p>Scan QR Code tiket umat</p>

  </div>


  <!-- PETUGAS -->

  <div
    class="card"
    id="petugasCard"
  >

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      type="text"
      id="petugas"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >

    <button
      type="button"
      class="btn-primary"
      id="btnMulai"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>

    <button
      type="button"
      class="btn-secondary"
      id="btnGantiPetugas"
      onclick="gantiPetugas()"
      style="display:none"
    >
      Ganti Petugas
    </button>

    <div
      id="statusAwal"
      class="status"
    ></div>

  </div>


  <!-- SCANNER -->

  <div
    class="card hidden"
    id="scannerCard"
  >

    <div class="petugas-info">

      <small>Petugas</small>

      <strong id="namaPetugasAktif">
        -
      </strong>

    </div>


    <h3 style="margin-top:16px;">
      Arahkan kamera ke QR tiket
    </h3>


    <div id="reader"></div>


    <div
      id="scannerStatus"
      class="status info"
    >
      Kamera sedang dibuka...
    </div>


    <div
      id="qrDebug"
      class="qr-debug"
      style="display:none"
    ></div>


    <button
      type="button"
      class="btn-danger"
      onclick="stopScannerManual()"
    >
      ✕ Tutup Kamera
    </button>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >
    ⏳ Memproses check-in...
  </div>


  <!-- RESULT -->

  <div
    class="card result"
    id="resultCard"
  >

    <h2 id="resultTitle"></h2>


    <div
      id="resultStatus"
      class="status"
    ></div>


    <div id="resultData"></div>


    <button
      type="button"
      class="btn-primary"
      id="btnScanBerikutnya"
      onclick="scanBerikutnya()"
    >
      📷 Scan Tiket Berikutnya
    </button>


    <button
      type="button"
      class="btn-secondary"
      onclick="gantiPetugas()"
    >
      Ganti Petugas
    </button>

  </div>


</div>



<script>


/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


/* =====================================================
   KONFIGURASI
===================================================== */

const STORAGE_KEY_PETUGAS =
  "scanner_misa_petugas";


/* =====================================================
   VARIABLE
===================================================== */

let html5QrCode = null;

let scannerAktif = false;

let sedangMemproses = false;

let jsonpScript = null;

let jsonpTimer = null;

let sedangMembukaKamera = false;


/* =====================================================
   LOAD HALAMAN
===================================================== */

window.addEventListener(
  "load",
  function() {

    const petugasTersimpan =
      localStorage.getItem(
        STORAGE_KEY_PETUGAS
      );

    if (
      petugasTersimpan &&
      petugasTersimpan.trim()
    ) {

      document
        .getElementById("petugas")
        .value =
        petugasTersimpan;

      tampilStatus(
        "statusAwal",
        "Petugas tersimpan. Silakan mulai scanner.",
        "info"
      );

    }

    else {

      tampilStatus(
        "statusAwal",
        "Masukkan nama petugas untuk memulai.",
        "info"
      );

    }

  }
);


/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner() {

  if (sedangMembukaKamera) {
    return;
  }


  if (scannerAktif) {
    return;
  }


  const inputPetugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  if (!inputPetugas) {

    tampilStatus(
      "statusAwal",
      "Masukkan nama petugas terlebih dahulu.",
      "warning"
    );

    return;

  }


  /*
    SIMPAN PETUGAS
  */

  localStorage.setItem(
    STORAGE_KEY_PETUGAS,
    inputPetugas
  );


  sedangMembukaKamera = true;


  try {

    /*
      Tampilkan scanner
    */

    document
      .getElementById("petugasCard")
      .classList
      .add("hidden");


    document
      .getElementById("resultCard")
      .style
      .display = "none";


    document
      .getElementById("scannerCard")
      .classList
      .remove("hidden");


    document
      .getElementById("namaPetugasAktif")
      .textContent =
      inputPetugas;


    tampilStatus(
      "scannerStatus",
      "Membuka kamera...",
      "info"
    );


    /*
      Bersihkan reader lama
    */

    const reader =
      document.getElementById(
        "reader"
      );

    reader.innerHTML = "";


    /*
      Pastikan instance lama
      benar-benar sudah dibuang
    */

    if (html5QrCode) {

      try {

        if (scannerAktif) {
          await html5QrCode.stop();
        }

      }

      catch (e) {

        console.log(
          "Stop scanner lama:",
          e
        );

      }


      try {

        html5QrCode.clear();

      }

      catch (e) {}

      html5QrCode = null;

      scannerAktif = false;

    }


    /*
      Jeda kecil agar kamera HP
      benar-benar dilepas
    */

    await delay(300);


    /*
      Buat instance baru
    */

    html5QrCode =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox:
        function(
          width,
          height
        ) {

          const min =
            Math.min(
              width,
              height
            );

          const size =
            Math.floor(
              min * 0.70
            );

          return {

            width: size,

            height: size

          };

        },

      aspectRatio: 1.0

    };


    /*
      LANGSUNG BUKA KAMERA
      TANPA getUserMedia TERPISAH
    */

    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerAktif = true;


    tampilStatus(
      "scannerStatus",
      "Kamera aktif. Arahkan QR ke kamera.",
      "info"
    );

  }

  catch (error) {

    console.error(
      "Gagal membuka kamera:",
      error
    );


    scannerAktif = false;


    if (html5QrCode) {

      try {
        html5QrCode.clear();
      }

      catch (e) {}

    }


    html5QrCode = null;


    document
      .getElementById("scannerCard")
      .classList
      .add("hidden");


    document
      .getElementById("petugasCard")
      .classList
      .remove("hidden");


    let pesan =
      "Kamera tidak dapat digunakan.";


    if (
      error &&
      error.name === "NotAllowedError"
    ) {

      pesan =
        "Akses kamera ditolak. " +
        "Izinkan kamera pada browser.";

    }

    else if (
      error &&
      error.name === "NotFoundError"
    ) {

      pesan =
        "Kamera tidak ditemukan.";

    }

    else if (
      error &&
      error.name === "NotReadableError"
    ) {

      pesan =
        "Kamera sedang digunakan aplikasi lain. " +
        "Tutup aplikasi kamera atau aplikasi lain.";

    }

    else if (
      error &&
      error.name === "SecurityError"
    ) {

      pesan =
        "Browser memblokir kamera. " +
        "Pastikan halaman dibuka melalui HTTPS.";

    }

    else if (
      error &&
      error.message
    ) {

      pesan =
        "Kamera tidak dapat digunakan: " +
        error.message;

    }


    tampilStatus(
      "statusAwal",
      pesan,
      "error"
    );

  }

  finally {

    sedangMembukaKamera = false;

  }

}


/* =====================================================
   QR BERHASIL
===================================================== */

async function onScanSuccess(
  decodedText
) {

  if (sedangMemproses) {
    return;
  }


  sedangMemproses = true;


  const idRegistrasi =
    String(
      decodedText || ""
    ).trim();


  if (!idRegistrasi) {

    sedangMemproses = false;

    return;

  }


  /*
    TAMPILKAN SEGERA
    supaya tidak terasa lambat
  */

  tampilStatus(
    "scannerStatus",
    "QR terbaca. Memproses check-in...",
    "info"
  );


  const debug =
    document.getElementById(
      "qrDebug"
    );


  debug.style.display =
    "block";


  debug.innerHTML =
    "<b>QR TERBACA:</b><br>" +
    escapeHTML(
      idRegistrasi
    );


  /*
    Ambil petugas dari localStorage
  */

  const petugas =
    localStorage.getItem(
      STORAGE_KEY_PETUGAS
    ) ||
    document
      .getElementById("petugas")
      .value
      .trim();


  /*
    STOP KAMERA
  */

  await stopScanner();


  /*
    Tampilkan loading
  */

  document
    .getElementById("loading")
    .style
    .display = "block";


  /*
    Panggil API
  */

  panggilAPI(
    idRegistrasi,
    petugas
  );

}


/* =====================================================
   PANGGIL API CHECK-IN
===================================================== */

function panggilAPI(
  idRegistrasi,
  petugas
) {

  bersihkanJSONP();


  const callbackName =
    "misaCheckIn_" +
    Date.now();


  window[callbackName] =
    function(result) {

      console.log(
        "RESPON API:",
        result
      );


      bersihkanJSONP();


      document
        .getElementById("loading")
        .style
        .display = "none";


      tampilHasil(
        result
      );


      sedangMemproses = false;

    };


  const url =
    API_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(
      idRegistrasi
    ) +
    "&petugas=" +
    encodeURIComponent(
      petugas
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  console.log(
    "MEMANGGIL API:",
    url
  );


  jsonpScript =
    document.createElement(
      "script"
    );


  jsonpScript.src =
    url;


  jsonpScript.async = true;


  jsonpScript.onerror =
    function() {

      console.error(
        "API gagal dimuat:",
        url
      );


      bersihkanJSONP();


      document
        .getElementById("loading")
        .style
        .display = "none";


      tampilHasil({

        success: false,

        alreadyCheckedIn: false,

        message:
          "Server check-in tidak dapat dihubungi. Silakan coba lagi."

      });


      sedangMemproses = false;

    };


  document
    .head
    .appendChild(
      jsonpScript
    );


  /*
    Timeout 10 detik
  */

  jsonpTimer =
    setTimeout(
      function() {

        console.error(
          "TIMEOUT API:",
          url
        );


        bersihkanJSONP();


        document
          .getElementById("loading")
          .style
          .display = "none";


        tampilHasil({

          success: false,

          alreadyCheckedIn: false,

          message:
            "Server terlalu lama merespons. Silakan coba lagi."

        });


        sedangMemproses = false;

      },
      10000
    );

}


/* =====================================================
   BERSIHKAN JSONP
===================================================== */

function bersihkanJSONP() {

  if (jsonpTimer) {

    clearTimeout(
      jsonpTimer
    );

    jsonpTimer = null;

  }


  if (jsonpScript) {

    try {

      jsonpScript.remove();

    }

    catch (e) {}

    jsonpScript = null;

  }

}


/* =====================================================
   SCAN GAGAL
===================================================== */

function onScanFailure() {

  /*
    Tidak perlu melakukan apa-apa.
    Scanner tetap berjalan.
  */

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

  if (!html5QrCode) {

    scannerAktif = false;

    return;

  }


  try {

    if (scannerAktif) {

      await html5QrCode.stop();

    }

  }

  catch (error) {

    console.log(
      "Stop scanner:",
      error
    );

  }


  try {

    html5QrCode.clear();

  }

  catch (error) {}


  html5QrCode = null;

  scannerAktif = false;


  /*
    Bersihkan elemen kamera
  */

  const reader =
    document.getElementById(
      "reader"
    );

  if (reader) {
    reader.innerHTML = "";
  }

}


/* =====================================================
   STOP MANUAL
===================================================== */

async function stopScannerManual() {

  await stopScanner();


  document
    .getElementById("scannerCard")
    .classList
    .add("hidden");


  document
    .getElementById("petugasCard")
    .classList
    .remove("hidden");


  tampilStatus(
    "statusAwal",
    "Kamera ditutup. Petugas tetap tersimpan.",
    "info"
  );

}


/* =====================================================
   TAMPIL HASIL
===================================================== */

function tampilHasil(
  result
) {

  document
    .getElementById("resultCard")
    .style
    .display = "block";


  const title =
    document.getElementById(
      "resultTitle"
    );


  const status =
    document.getElementById(
      "resultStatus"
    );


  const data =
    document.getElementById(
      "resultData"
    );


  data.innerHTML = "";


  /*
    CHECK-IN GAGAL
  */

  if (
    !result ||
    !result.success
  ) {

    if (
      result &&
      result.alreadyCheckedIn
    ) {

      title.textContent =
        "⚠️ Sudah Check-In";


      tampilStatus(
        "resultStatus",
        result.message ||
        "Tiket sudah digunakan.",
        "warning"
      );

    }

    else {

      title.textContent =
        "❌ Check-In Ditolak";


      tampilStatus(
        "resultStatus",
        result &&
        result.message
          ? result.message
          : "Tiket tidak dapat digunakan.",
        "error"
      );

    }

    return;

  }


  /*
    CHECK-IN BERHASIL
  */

  title.textContent =
    "✅ Check-In Berhasil";


  tampilStatus(
    "resultStatus",
    result.message ||
    "Tiket berhasil digunakan.",
    "success"
  );


  tambahData(
    "Nama",
    result.nama
  );


  tambahData(
    "Misa",
    result.namaMisa
  );


  tambahData(
    "Tanggal",
    result.tanggal
  );


  tambahData(
    "Jam",
    result.jam
  );


  tambahData(
    "Jumlah",
    result.jumlah +
    " umat"
  );


  tambahData(
    "Waktu Check-In",
    result.waktuCheckIn
  );

}


/* =====================================================
   TAMBAH DATA HASIL
===================================================== */

function tambahData(
  label,
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return;

  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "data-row";


  div.innerHTML =
    '<div class="label-small">' +
    escapeHTML(label) +
    '</div>' +

    '<div class="value">' +
    escapeHTML(
      String(value)
    ) +
    '</div>';


  document
    .getElementById(
      "resultData"
    )
    .appendChild(div);

}


/* =====================================================
   SCAN BERIKUTNYA
===================================================== */

async function scanBerikutnya() {

  /*
    Tutup hasil
  */

  document
    .getElementById(
      "resultCard"
    )
    .style
    .display = "none";


  /*
    Pastikan loading hilang
  */

  document
    .getElementById(
      "loading"
    )
    .style
    .display = "none";


  /*
    Reset status
  */

  sedangMemproses = false;


  /*
    Hapus QR debug
  */

  const debug =
    document.getElementById(
      "qrDebug"
    );

  debug.style.display =
    "none";

  debug.innerHTML = "";


  /*
    LANGSUNG BUKA SCANNER
    TANPA MINTA NAMA PETUGAS LAGI
  */

  await mulaiScanner();

}


/* =====================================================
   GANTI PETUGAS
===================================================== */

async function gantiPetugas() {

  await stopScanner();


  localStorage.removeItem(
    STORAGE_KEY_PETUGAS
  );


  document
    .getElementById(
      "petugas"
    )
    .value = "";


  document
    .getElementById(
      "resultCard"
    )
    .style
    .display = "none";


  document
    .getElementById(
      "scannerCard"
    )
    .classList
    .add("hidden");


  document
    .getElementById(
      "petugasCard"
    )
    .classList
    .remove("hidden");


  tampilStatus(
    "statusAwal",
    "Masukkan nama petugas baru.",
    "info"
  );


  document
    .getElementById(
      "petugas"
    )
    .focus();

}


/* =====================================================
   STATUS
===================================================== */

function tampilStatus(
  id,
  message,
  type
) {

  const el =
    document.getElementById(
      id
    );


  if (!el) {
    return;
  }


  el.className =
    "status";


  if (!message) {

    el.style.display =
      "none";

    el.innerHTML = "";

    return;

  }


  el.classList.add(
    type
  );


  el.innerHTML =
    escapeHTML(
      message
    );

}


/* =====================================================
   DELAY
===================================================== */

function delay(
  ms
) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Check-In Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .box {
      width: 100%;
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin: 0 0 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      background: #2563eb;
      color: white;
    }

    #btnStop {
      background: #dc2626;
    }

    .hidden {
      display: none !important;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
      background: #f3f4f6;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .info {
      background: #dbeafe !important;
      color: #1e40af;
    }

    .warning {
      background: #fef3c7 !important;
      color: #92400e;
    }

    .ticket {
      margin-top: 12px;
      padding: 14px;
      background: rgba(255,255,255,.7);
      border-radius: 10px;
      text-align: left;
    }

    .row {
      margin: 6px 0;
    }

    .label {
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="box">

  <h2>Scanner Check-In Misa</h2>


  <label for="petugas">
    Nama Petugas
  </label>


  <input
    id="petugas"
    type="text"
    placeholder="Masukkan nama petugas"
    autocomplete="off"
  >


  <button
    id="btnStart"
    type="button"
    onclick="mulaiScanner()"
  >
    Mulai Scanner
  </button>


  <button
    id="btnStop"
    type="button"
    onclick="stopScanner()"
    class="hidden"
  >
    Hentikan Scanner
  </button>


  <div id="reader"></div>


  <div id="status">
    Scanner belum dimulai.
  </div>

</div>


<script>


/* =====================================================
   CONFIG
===================================================== */

const API =
  "https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


/* =====================================================
   VARIABLE
===================================================== */

let scanner = null;

let scannerAktif = false;

let sedangProses = false;


/*
  Window Bridge yang sudah dibuka
  saat user menekan "Mulai Scanner".
*/

let bridgeWindow = null;


/*
  Timeout check-in.
*/

let bridgeTimeout = null;


/* =====================================================
   STATUS
===================================================== */

function setStatus(
  pesan,
  tipe
) {

  const el =
    document.getElementById(
      "status"
    );

  el.className = "";

  if (tipe) {
    el.classList.add(tipe);
  }

  el.innerHTML =
    pesan;

}


/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner() {

  if (scannerAktif) {
    return;
  }


  const petugas =
    document
      .getElementById(
        "petugas"
      )
      .value
      .trim();


  if (!petugas) {

    setStatus(
      "<b>Nama petugas wajib diisi.</b>",
      "error"
    );

    return;
  }


  /*
    =====================================================
    PENTING
    =====================================================

    Window Bridge dibuka DI DALAM klik tombol.

    Dengan begitu browser menganggapnya
    sebagai popup yang diizinkan.

    Nantinya window ini kita gunakan kembali
    saat QR terbaca.
  */

  bridgeWindow =
    window.open(
      "about:blank",
      "misaCheckinBridge",
      "width=500,height=700"
    );


  if (!bridgeWindow) {

    setStatus(
      "<b>Popup Bridge diblokir browser.</b><br>" +
      "Izinkan pop-up untuk situs scanner ini.",
      "error"
    );

    return;
  }


  /*
    Tampilkan halaman kosong sementara.
  */

  try {

    bridgeWindow.document.open();

    bridgeWindow.document.write(
      "<html>" +
      "<body style='font-family:Arial;text-align:center;padding:30px'>" +
      "<h3>Scanner Check-In</h3>" +
      "<p>Bridge siap.</p>" +
      "</body>" +
      "</html>"
    );

    bridgeWindow.document.close();

  }
  catch (e) {}


  setStatus(
    "Meminta izin kamera...",
    "info"
  );


  try {

    /*
      Permission kamera.
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {

        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            const ukuran =
              Math.min(
                width,
                height
              ) * 0.70;


            return {
              width: ukuran,
              height: ukuran
            };

          },

        aspectRatio: 1.0

      },

      qrBerhasil,

      function(errorMessage) {
        /*
          Abaikan error frame biasa.
        */
      }

    );


    scannerAktif =
      true;


    document
      .getElementById(
        "btnStart"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "btnStop"
      )
      .classList.remove(
        "hidden"
      );


    setStatus(
      "<b>Scanner aktif.</b><br>" +
      "Arahkan kamera ke QR tiket.",
      "success"
    );

  }

  catch (error) {

    console.error(
      error
    );


    /*
      Kalau kamera gagal,
      tutup Bridge.
    */

    tutupBridge();


    setStatus(
      "<b>Kamera tidak dapat dibuka.</b><br>" +
      "Pastikan izin kamera diberikan.",
      "error"
    );

  }

}


/* =====================================================
   QR BERHASIL
===================================================== */

function qrBerhasil(
  decodedText
) {

  if (sedangProses) {
    return;
  }


  const idRegistrasi =
    String(
      decodedText || ""
    ).trim();


  if (!idRegistrasi) {
    return;
  }


  const petugas =
    document
      .getElementById(
        "petugas"
      )
      .value
      .trim();


  if (!petugas) {

    setStatus(
      "<b>Nama petugas belum diisi.</b>",
      "error"
    );

    return;
  }


  sedangProses =
    true;


  setStatus(
    "<b>QR TERBACA</b><br>" +
    "Memeriksa tiket...",
    "info"
  );


  kirimKeBridge(
    idRegistrasi,
    petugas
  );

}


/* =====================================================
   KIRIM KE BRIDGE
===================================================== */

function kirimKeBridge(
  idRegistrasi,
  petugas
) {

  /*
    Pastikan window Bridge masih hidup.
  */

  if (
    !bridgeWindow ||
    bridgeWindow.closed
  ) {

    sedangProses =
      false;


    setStatus(
      "<b>Bridge tidak tersedia.</b><br>" +
      "Tekan Hentikan Scanner lalu " +
      "Mulai Scanner kembali.",
      "error"
    );

    return;
  }


  /*
    URL Bridge.
  */

  const url =
    API +
    "?page=bridge" +
    "&id=" +
    encodeURIComponent(
      idRegistrasi
    ) +
    "&petugas=" +
    encodeURIComponent(
      petugas
    );


  console.log(
    "BRIDGE URL:",
    url
  );


  /*
    Kirim URL ke window yang sudah dibuka.
  */

  try {

    bridgeWindow.location.href =
      url;

    bridgeWindow.focus();

  }

  catch (error) {

    console.error(
      error
    );


    sedangProses =
      false;


    setStatus(
      "<b>Bridge gagal dibuka.</b>",
      "error"
    );

    return;

  }


  /*
    Timeout.
  */

  if (bridgeTimeout) {

    clearTimeout(
      bridgeTimeout
    );

  }


  bridgeTimeout =
    setTimeout(
      function() {

        if (bridgeTimeout) {

          clearTimeout(
            bridgeTimeout
          );

          bridgeTimeout =
            null;

        }


        sedangProses =
          false;


        setStatus(
          "<b>SERVER TIDAK MERESPONS</b><br>" +
          "Tidak menerima jawaban dari server Check-In.",
          "error"
        );

      },
      20000
    );

}


/* =====================================================
   TERIMA HASIL DARI BRIDGE
===================================================== */

function terimaPesan(
  event
) {

  console.log(
    "MESSAGE DITERIMA:",
    event.data
  );


  const data =
    event.data;


  if (!data) {
    return;
  }


  if (
    data.type !==
    "MISA_CHECKIN_RESULT"
  ) {

    return;
  }


  /*
    Kita tidak menggunakan nonce.
    Kita tidak menggunakan iframe.
    Kita cukup menerima hasil dari
    window Bridge yang kita buka.
  */


  if (bridgeTimeout) {

    clearTimeout(
      bridgeTimeout
    );

    bridgeTimeout =
      null;

  }


  tampilkanHasil(
    data.data
  );

}


/* =====================================================
   HASIL CHECK-IN
===================================================== */

function tampilkanHasil(
  hasil
) {

  if (!hasil) {

    setStatus(
      "<b>RESPON SERVER KOSONG.</b>",
      "error"
    );

    sedangProses =
      false;

    return;
  }


  console.log(
    "HASIL CHECK-IN:",
    hasil
  );


  /*
    BERHASIL
  */

  if (hasil.success) {

    let html =
      "<b>CHECK-IN BERHASIL</b>" +
      "<div class='ticket'>";


    if (hasil.nama) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Nama:</span> " +
        escapeHtml(
          hasil.nama
        ) +
        "</div>";

    }


    if (hasil.namaMisa) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Misa:</span> " +
        escapeHtml(
          hasil.namaMisa
        ) +
        "</div>";

    }


    if (hasil.tanggal) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Tanggal:</span> " +
        escapeHtml(
          hasil.tanggal
        ) +
        "</div>";

    }


    if (hasil.jam) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Jam:</span> " +
        escapeHtml(
          hasil.jam
        ) +
        "</div>";

    }


    if (
      hasil.jumlah !==
      undefined
    ) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Jumlah:</span> " +
        escapeHtml(
          String(
            hasil.jumlah
          )
        ) +
        "</div>";

    }


    if (hasil.waktuCheckIn) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Waktu:</span> " +
        escapeHtml(
          hasil.waktuCheckIn
        ) +
        "</div>";

    }


    html +=
      "</div>";


    setStatus(
      html,
      "success"
    );

  }


  /*
    SUDAH CHECK-IN
  */

  else if (
    hasil.alreadyCheckedIn
  ) {

    let html =
      "<b>TIKET SUDAH CHECK-IN</b>" +
      "<div class='ticket'>";


    if (hasil.nama) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Nama:</span> " +
        escapeHtml(
          hasil.nama
        ) +
        "</div>";

    }


    if (hasil.namaMisa) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Misa:</span> " +
        escapeHtml(
          hasil.namaMisa
        ) +
        "</div>";

    }


    if (hasil.waktuCheckIn) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Check-In:</span> " +
        escapeHtml(
          hasil.waktuCheckIn
        ) +
        "</div>";

    }


    if (hasil.petugasSebelumnya) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Petugas:</span> " +
        escapeHtml(
          hasil.petugasSebelumnya
        ) +
        "</div>";

    }


    html +=
      "</div>";


    setStatus(
      html,
      "warning"
    );

  }


  /*
    DITOLAK
  */

  else {

    setStatus(
      "<b>CHECK-IN DITOLAK</b><br><br>" +
      escapeHtml(
        hasil.message ||
        "Tiket tidak dapat diproses."
      ),
      "error"
    );

  }


  /*
    Siapkan scanner untuk QR berikutnya.
  */

  setTimeout(
    function() {

      sedangProses =
        false;

    },
    1500
  );

}


/* =====================================================
   TUTUP BRIDGE
===================================================== */

function tutupBridge() {

  if (bridgeTimeout) {

    clearTimeout(
      bridgeTimeout
    );

    bridgeTimeout =
      null;

  }


  if (
    bridgeWindow &&
    !bridgeWindow.closed
  ) {

    try {

      bridgeWindow.close();

    }
    catch (error) {}

  }


  bridgeWindow =
    null;

}


/* =====================================================
   STOP SCANNER
===================================================== */

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerAktif
    ) {

      await scanner.stop();

      scanner.clear();

    }

  }
  catch (error) {

    console.error(
      error
    );

  }


  scanner =
    null;

  scannerAktif =
    false;

  sedangProses =
    false;


  tutupBridge();


  document
    .getElementById(
      "btnStart"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "btnStop"
    )
    .classList.add(
      "hidden"
    );


  setStatus(
    "Scanner dihentikan.",
    "info"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   LISTENER
===================================================== */

window.addEventListener(
  "message",
  terimaPesan,
  false
);


/* =====================================================
   SEBELUM HALAMAN DITUTUP
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    tutupBridge();

  }
);

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Check-In Misa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #202124;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  background: #17365d;
  color: white;
  padding: 22px 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  text-align: center;
}

.header h1 {
  margin: 0 0 6px;
  font-size: 24px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d7de;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.btn-primary {
  background: #17365d;
  color: white;
}

.btn-danger {
  background: #c62828;
  color: white;
}

.btn-secondary {
  background: #eeeeee;
  color: #222;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 15px;
  background: #111;
}

.status {
  padding: 14px;
  border-radius: 12px;
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
  word-break: break-word;
}

.info {
  background: #e8f1fb;
  color: #17365d;
}

.success {
  background: #e8f5e9;
  color: #1b5e20;
}

.error {
  background: #ffebee;
  color: #b71c1c;
}

.warning {
  background: #fff8e1;
  color: #8d6e00;
}

.hidden {
  display: none !important;
}

.loading {
  text-align: center;
  padding: 15px;
  font-weight: bold;
  display: none;
}

.result {
  display: none;
}

.result h2 {
  margin-top: 0;
}

.data-row {
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.label-small {
  color: #777;
  font-size: 12px;
}

.value {
  font-weight: bold;
  margin-top: 3px;
}

.debug {
  margin-top: 12px;
  padding: 10px;
  background: #f1f3f4;
  border-radius: 10px;
  font-size: 12px;
  word-break: break-all;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 Check-In Misa</h1>
    <p>Scan QR Code tiket umat</p>
  </div>


  <!-- PETUGAS -->

  <div class="card" id="petugasCard">

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      id="petugas"
      type="text"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >

    <button
      class="btn-primary"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>

    <div
      id="statusAwal"
      class="status info"
    >
      Masukkan nama petugas lalu mulai scanner.
    </div>

  </div>


  <!-- SCANNER -->

  <div
    class="card hidden"
    id="scannerCard"
  >

    <h3 style="margin-top:0;">
      Arahkan kamera ke QR tiket
    </h3>

    <div id="reader"></div>

    <div
      id="scannerStatus"
      class="status info"
    >
      Kamera aktif. Arahkan QR ke kamera.
    </div>

    <button
      class="btn-danger"
      onclick="stopScanner()"
    >
      ✕ Tutup Kamera
    </button>

  </div>


  <!-- LOADING -->

  <div
    id="loading"
    class="loading"
  >
    ⏳ Memproses check-in...
  </div>


  <!-- HASIL -->

  <div
    class="card result"
    id="resultCard"
  >

    <h2 id="resultTitle"></h2>

    <div
      id="resultStatus"
      class="status"
    ></div>

    <div id="resultData"></div>

    <div
      id="debug"
      class="debug"
      style="display:none"
    ></div>

    <button
      class="btn-primary"
      onclick="scanBerikutnya()"
    >
      📷 Scan Tiket Berikutnya
    </button>

  </div>

</div>


<script>

/*
==========================================================
APPS SCRIPT
==========================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


/*
==========================================================
VARIABLE
==========================================================
*/

let scanner = null;

let scannerAktif = false;

let sedangProses = false;


/*
==========================================================
MULAI SCANNER
==========================================================
*/

async function mulaiScanner() {

  if (sedangProses) {
    return;
  }

  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();

  if (!petugas) {

    tampilStatus(
      "statusAwal",
      "Masukkan nama petugas terlebih dahulu.",
      "warning"
    );

    return;
  }


  try {

    tampilStatus(
      "statusAwal",
      "Meminta izin kamera...",
      "info"
    );


    /*
    Tes permission kamera
    */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    /*
    Tampilkan scanner
    */

    document
      .getElementById("petugasCard")
      .classList
      .add("hidden");

    document
      .getElementById("scannerCard")
      .classList
      .remove("hidden");


    scanner =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0

    };


    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      qrBerhasil,

      function() {
        // QR belum terbaca
      }

    );


    scannerAktif = true;


    tampilStatus(
      "scannerStatus",
      "Kamera aktif. Arahkan QR ke kamera.",
      "info"
    );

  }

  catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    document
      .getElementById("scannerCard")
      .classList
      .add("hidden");


    document
      .getElementById("petugasCard")
      .classList
      .remove("hidden");


    tampilStatus(
      "statusAwal",
      "Kamera tidak dapat digunakan: " +
      (
        error.message ||
        error
      ),
      "error"
    );

  }

}


/*
==========================================================
QR BERHASIL DIBACA
==========================================================
*/

async function qrBerhasil(
  decodedText
) {

  if (sedangProses) {
    return;
  }


  sedangProses = true;


  const idRegistrasi =
    String(
      decodedText
    ).trim();


  console.log(
    "QR:",
    idRegistrasi
  );


  /*
  Hentikan kamera
  */

  await stopScanner();


  /*
  Loading
  */

  document
    .getElementById("loading")
    .style
    .display = "block";


  /*
  Ambil petugas
  */

  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  /*
  Panggil Apps Script
  */

  panggilCheckIn(
    idRegistrasi,
    petugas
  );

}


/*
==========================================================
CHECK-IN
==========================================================
*/

function panggilCheckIn(
  idRegistrasi,
  petugas
) {


  /*
  ========================================================
  CARA KERJA:
  
  Kita membuka endpoint Apps Script di TAB yang sama.
  
  Apps Script langsung memproses check-in.
  
  Hasilnya ditampilkan oleh halaman Apps Script.
  ========================================================
  */


  const url =
    API_URL +
    "?action=checkin" +
    "&id=" +
    encodeURIComponent(
      idRegistrasi
    ) +
    "&petugas=" +
    encodeURIComponent(
      petugas
    );


  console.log(
    "CHECK-IN URL:",
    url
  );


  /*
  Simpan data supaya bisa kembali
  */

  sessionStorage.setItem(
    "misa_return_scanner",
    "https://richardoseminari.github.io/scanner-misa/"
  );


  /*
  Simpan URL
  */

  sessionStorage.setItem(
    "misa_last_checkin_url",
    url
  );


  /*
  Buka Apps Script
  */

  window.location.href =
    url;

}


/*
==========================================================
STOP SCANNER
==========================================================
*/

async function stopScanner() {

  if (!scanner) {
    return;
  }


  try {

    if (scannerAktif) {

      await scanner.stop();

    }

  }

  catch (error) {

    console.log(
      "STOP CAMERA:",
      error
    );

  }


  try {

    scanner.clear();

  }

  catch (error) {}


  scanner = null;

  scannerAktif = false;

}


/*
==========================================================
SCAN BERIKUTNYA
==========================================================
*/

function scanBerikutnya() {

  document
    .getElementById("resultCard")
    .style
    .display = "none";


  document
    .getElementById("scannerCard")
    .classList
    .add("hidden");


  document
    .getElementById("petugasCard")
    .classList
    .remove("hidden");


  document
    .getElementById("loading")
    .style
    .display = "none";


  sedangProses = false;


  window.scrollTo(
    0,
    0
  );

}


/*
==========================================================
STATUS
==========================================================
*/

function tampilStatus(
  id,
  message,
  type
) {

  const element =
    document.getElementById(id);


  if (!element) {
    return;
  }


  element.className =
    "status " +
    type;


  element.textContent =
    message;

}


/*
==========================================================
ESCAPE HTML
==========================================================
*/

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/*
==========================================================
HASIL LOKAL
==========================================================
*/

function tampilHasil(
  result
) {

  document
    .getElementById("resultCard")
    .style
    .display = "block";


  const title =
    document.getElementById(
      "resultTitle"
    );


  const status =
    document.getElementById(
      "resultStatus"
    );


  const data =
    document.getElementById(
      "resultData"
    );


  data.innerHTML = "";


  if (
    !result ||
    !result.success
  ) {

    if (
      result &&
      result.alreadyCheckedIn
    ) {

      title.textContent =
        "⚠️ Sudah Check-In";


      status.className =
        "status warning";


      status.textContent =
        result.message ||
        "Tiket sudah melakukan check-in.";

    }

    else {

      title.textContent =
        "❌ Check-In Ditolak";


      status.className =
        "status error";


      status.textContent =
        result &&
        result.message
          ? result.message
          : "Check-in gagal.";

    }

    return;
  }


  title.textContent =
    "✅ Check-In Berhasil";


  status.className =
    "status success";


  status.textContent =
    result.message ||
    "Tiket berhasil melakukan check-in.";


  tambahData(
    "Nama",
    result.nama
  );


  tambahData(
    "Misa",
    result.namaMisa
  );


  tambahData(
    "Tanggal",
    result.tanggal
  );


  tambahData(
    "Jam",
    result.jam
  );


  tambahData(
    "Jumlah",
    result.jumlah +
    " umat"
  );


  tambahData(
    "Waktu Check-In",
    result.waktuCheckIn
  );

}


/*
==========================================================
TAMBAH DATA
==========================================================
*/

function tambahData(
  label,
  value
) {

  if (
    value === undefined ||
    value === null
  ) {
    return;
  }


  const row =
    document.createElement(
      "div"
    );


  row.className =
    "data-row";


  row.innerHTML =
    "<div class='label-small'>" +
    escapeHTML(label) +
    "</div>" +

    "<div class='value'>" +
    escapeHTML(
      String(value)
    ) +
    "</div>";


  document
    .getElementById(
      "resultData"
    )
    .appendChild(
      row
    );

}


/*
==========================================================
LOAD
==========================================================
*/

window.addEventListener(
  "load",
  function() {

    console.log(
      "Scanner Misa siap."
    );

  }
);

</script>

</body>
</html>

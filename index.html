<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Check-In Misa</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #202124;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  background: #17365d;
  color: white;
  padding: 22px 18px;
  border-radius: 18px;
  margin-bottom: 18px;
  text-align: center;
}

.header h1 {
  margin: 0 0 6px;
  font-size: 24px;
}

.header p {
  margin: 0;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d7de;
  border-radius: 12px;
  font-size: 16px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 13px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.btn-primary {
  background: #17365d;
  color: white;
}

.btn-danger {
  background: #c62828;
  color: white;
}

#reader {
  width: 100%;
  margin-top: 15px;
  overflow: hidden;
  border-radius: 15px;
  background: #111;
}

.status {
  padding: 14px;
  border-radius: 12px;
  margin-top: 14px;
  font-size: 14px;
  line-height: 1.5;
  display: none;
  word-break: break-word;
}

.status.info {
  display: block;
  background: #e8f1fb;
  color: #17365d;
}

.status.success {
  display: block;
  background: #e8f5e9;
  color: #1b5e20;
}

.status.error {
  display: block;
  background: #ffebee;
  color: #b71c1c;
}

.status.warning {
  display: block;
  background: #fff8e1;
  color: #8d6e00;
}

.result {
  display: none;
}

.result h2 {
  margin-top: 0;
}

.data-row {
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.label-small {
  color: #777;
  font-size: 12px;
}

.value {
  font-weight: bold;
  margin-top: 3px;
}

.hidden {
  display: none !important;
}

.loading {
  text-align: center;
  padding: 15px;
  display: none;
  font-weight: bold;
}

.qr-debug {
  margin-top: 10px;
  padding: 10px;
  background: #f1f3f4;
  border-radius: 10px;
  font-size: 12px;
  word-break: break-all;
}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>📷 Check-In Misa</h1>
    <p>Scan QR Code tiket umat</p>
  </div>


  <div class="card" id="petugasCard">

    <label for="petugas">
      Nama Petugas
    </label>

    <input
      type="text"
      id="petugas"
      placeholder="Contoh: Budi"
      autocomplete="name"
    >

    <button
      type="button"
      class="btn-primary"
      onclick="mulaiScanner()"
    >
      📷 Mulai Scanner
    </button>

    <button
      type="button"
      class="btn-danger"
      onclick="gantiPetugas()"
      style="margin-top:10px"
    >
      Ganti Petugas
    </button>

    <div
      id="statusAwal"
      class="status"
    ></div>

  </div>


  <div
    class="card hidden"
    id="scannerCard"
  >

    <h3 style="margin-top:0;">
      Arahkan kamera ke QR tiket
    </h3>

    <div id="reader"></div>

    <div
      id="scannerStatus"
      class="status info"
    >
      Kamera aktif. Arahkan QR ke kamera.
    </div>

    <div
      id="qrDebug"
      class="qr-debug"
      style="display:none"
    ></div>

    <button
      type="button"
      class="btn-danger"
      onclick="stopScanner()"
    >
      ✕ Tutup Kamera
    </button>

  </div>


  <div
    id="loading"
    class="loading"
  >
    ⏳ Memproses check-in...
  </div>


  <div
    class="card result"
    id="resultCard"
  >

    <h2 id="resultTitle"></h2>

    <div
      id="resultStatus"
      class="status"
    ></div>

    <div id="resultData"></div>

    <button
      type="button"
      class="btn-primary"
      onclick="scanBerikutnya()"
    >
      📷 Scan Tiket Berikutnya
    </button>

  </div>

  <!--
    Iframe tersembunyi untuk memanggil Apps Script.
    Hasilnya dikirim kembali ke halaman ini melalui postMessage.
  -->
</div>


<script>


/* =====================================================
   URL APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


let html5QrCode = null;

let scannerAktif = false;

let sedangMemproses = false;


/* =====================================================
   MULAI SCANNER
===================================================== */

async function mulaiScanner() {

  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  if (!petugas) {

    tampilStatus(
      "statusAwal",
      "Masukkan nama petugas terlebih dahulu.",
      "warning"
    );

    return;
  }

  sessionStorage.setItem("MISA_PETUGAS", petugas);


  try {

    tampilStatus(
      "statusAwal",
      "Memeriksa kamera...",
      "info"
    );


    document
      .getElementById("petugasCard")
      .classList
      .add("hidden");


    document
      .getElementById("scannerCard")
      .classList
      .remove("hidden");


    html5QrCode =
      new Html5Qrcode("reader");


    const config = {

      fps: 10,

      qrbox:
        function(
          width,
          height
        ) {

          const min =
            Math.min(
              width,
              height
            );

          const size =
            Math.floor(
              min * 0.70
            );

          return {
            width: size,
            height: size
          };

        },

      aspectRatio: 1.0

    };


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerAktif = true;


    tampilStatus(
      "scannerStatus",
      "Kamera aktif. Arahkan QR ke kamera.",
      "info"
    );

  }

  catch (error) {

    console.error(error);


    document
      .getElementById("scannerCard")
      .classList
      .add("hidden");


    document
      .getElementById("petugasCard")
      .classList
      .remove("hidden");


    tampilStatus(
      "statusAwal",
      "Kamera tidak dapat digunakan: " +
      (
        error &&
        error.message
          ? error.message
          : "Unknown error"
      ),
      "error"
    );

  }

}


/* =====================================================
   QR TERBACA
===================================================== */

async function onScanSuccess(
  decodedText
) {

  if (sedangMemproses) {
    return;
  }

  sedangMemproses = true;

  const idRegistrasi =
    String(decodedText || "").trim();

  console.log("QR TERBACA:", idRegistrasi);

  const debug = document.getElementById("qrDebug");
  debug.style.display = "block";
  debug.innerHTML =
    "<b>QR TERBACA:</b><br>" + escapeHTML(idRegistrasi);

  await stopScanner();

  document.getElementById("scannerCard").classList.add("hidden");
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("loading").style.display = "block";

  const petugas = document.getElementById("petugas").value.trim();

  /*
    Apps Script dipanggil sebagai JSONP.
    Tidak ada iframe, fetch/CORS, postMessage, atau pindah halaman.
  */

  const callbackName = "misaCheckinCallback_" + Date.now();
  const script = document.createElement("script");

  const url =
    API_URL +
    "?action=checkin" +
    "&id=" + encodeURIComponent(idRegistrasi) +
    "&petugas=" + encodeURIComponent(petugas) +
    "&callback=" + encodeURIComponent(callbackName) +
    "&t=" + Date.now();

  console.log("MEMPROSES CHECK-IN:", url);

  let selesai = false;

  const timeoutId = setTimeout(function() {
    if (selesai) return;

    selesai = true;
    cleanup();

    document.getElementById("loading").style.display = "none";

    tampilHasil({
      success: false,
      alreadyCheckedIn: false,
      message: "Server check-in tidak memberikan jawaban dalam 15 detik. Periksa koneksi internet lalu coba lagi."
    });

    sedangMemproses = false;
  }, 15000);

  function cleanup() {
    clearTimeout(timeoutId);

    try {
      delete window[callbackName];
    } catch (e) {}

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  }

  window[callbackName] = function(result) {
    if (selesai) return;

    selesai = true;
    cleanup();

    console.log("HASIL CHECK-IN:", result);

    document.getElementById("loading").style.display = "none";

    tampilHasil(result || {});

    sedangMemproses = false;
  };

  script.onerror = function() {
    if (selesai) return;

    selesai = true;
    cleanup();

    document.getElementById("loading").style.display = "none";

    tampilHasil({
      success: false,
      alreadyCheckedIn: false,
      message: "Tidak dapat terhubung ke server check-in. Periksa koneksi internet lalu coba lagi."
    });

    sedangMemproses = false;
  };

  script.src = url;
  document.body.appendChild(script);

}


/* =====================================================
   SCAN GAGAL
===================================================== */

function onScanFailure() {

  // scanner terus berjalan

}


/* =====================================================
   STOP CAMERA
===================================================== */

async function stopScanner() {

  if (html5QrCode) {

    try {

      if (scannerAktif) {

        await html5QrCode.stop();

      }

    }

    catch (error) {

      console.log(
        "stop:",
        error
      );

    }


    try {

      html5QrCode.clear();

    }

    catch (error) {}

  }


  html5QrCode = null;

  scannerAktif = false;

}


/* =====================================================
   TAMPIL HASIL
===================================================== */

function tampilHasil(
  result
) {

  document
    .getElementById("resultCard")
    .style
    .display = "block";


  const title =
    document.getElementById(
      "resultTitle"
    );


  const status =
    document.getElementById(
      "resultStatus"
    );


  const data =
    document.getElementById(
      "resultData"
    );


  data.innerHTML = "";


  if (
    !result ||
    !result.success
  ) {

    if (
      result &&
      result.alreadyCheckedIn
    ) {

      title.textContent =
        "⚠️ Sudah Check-In";


      tampilStatus(
        "resultStatus",

        result.message ||
        "Tiket sudah digunakan.",

        "warning"
      );

    }

    else {

      title.textContent =
        "❌ Check-In Ditolak";


      tampilStatus(
        "resultStatus",

        result &&
        result.message
          ? result.message
          : "Tiket tidak dapat digunakan.",

        "error"
      );

    }

    return;
  }


  title.textContent =
    "✅ Check-In Berhasil";


  tampilStatus(
    "resultStatus",

    result.message ||
    "Tiket berhasil digunakan.",

    "success"
  );


  tambahData(
    "Nama",
    result.nama
  );


  tambahData(
    "Misa",
    result.namaMisa
  );


  tambahData(
    "Tanggal",
    result.tanggal
  );


  tambahData(
    "Jam",
    result.jam
  );


  tambahData(
    "Jumlah",
    result.jumlah + " umat"
  );


  tambahData(
    "Waktu Check-In",
    result.waktuCheckIn
  );

}


/* =====================================================
   DATA
===================================================== */

function tambahData(
  label,
  value
) {

  if (
    value === undefined ||
    value === null ||
    value === ""
  ) {

    return;
  }


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "data-row";


  div.innerHTML =
    '<div class="label-small">' +
    escapeHTML(label) +
    '</div>' +

    '<div class="value">' +
    escapeHTML(
      String(value)
    ) +
    '</div>';


  document
    .getElementById(
      "resultData"
    )
    .appendChild(div);

}


/* =====================================================
   SCAN BERIKUTNYA
===================================================== */

async function scanBerikutnya() {

  document.getElementById("resultCard").style.display = "none";
  document.getElementById("loading").style.display = "none";
  document.getElementById("scannerCard").classList.remove("hidden");

  const debug = document.getElementById("qrDebug");
  debug.style.display = "none";
  debug.innerHTML = "";

  sedangMemproses = false;

  /*
    Ini dijalankan langsung dari klik tombol petugas.
    Karena masih pada halaman yang sama, browser mengizinkan
    kamera dibuka kembali tanpa navigasi halaman.
  */
  await mulaiScanner();
}


/* =====================================================
   GANTI PETUGAS
===================================================== */

function gantiPetugas() {
  sessionStorage.removeItem("MISA_PETUGAS");
  document.getElementById("petugas").value = "";
  tampilStatus("statusAwal", "Silakan masukkan nama petugas baru.", "info");
}


/* =====================================================
   STATUS
===================================================== */

function tampilStatus(
  id,
  message,
  type
) {

  const el =
    document.getElementById(id);


  if (!el) {
    return;
  }


  el.className =
    "status";


  if (!message) {

    el.style.display =
      "none";

    el.innerHTML = "";

    return;
  }


  el.classList.add(
    type
  );


  el.innerHTML =
    escapeHTML(
      message
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   LOAD
===================================================== */

window.addEventListener("load", function() {

  const tersimpan = sessionStorage.getItem("MISA_PETUGAS") || "";
  const input = document.getElementById("petugas");

  if (tersimpan) {
    input.value = tersimpan;
    tampilStatus(
      "statusAwal",
      "Nama petugas tersimpan. Tekan Mulai Scanner.",
      "success"
    );
  } else {
    tampilStatus(
      "statusAwal",
      "Kamera siap. Masukkan nama petugas lalu mulai scanner.",
      "info"
    );
  }

});


/* Simpan nama petugas saat scanner dimulai. */
const petugasInput = document.getElementById("petugas");
petugasInput.addEventListener("change", function() {
  const nama = this.value.trim();
  if (nama) {
    sessionStorage.setItem("MISA_PETUGAS", nama);
  }
});

</script>

</body>
</html>

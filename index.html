<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Check-In Misa</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .box {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin: 0 0 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      background: #2563eb;
      color: white;
    }

    #btnStop {
      background: #dc2626;
    }

    .hidden {
      display: none !important;
    }

    #reader {
      width: 100%;
      margin-top: 18px;
      overflow: hidden;
      border-radius: 12px;
    }

    #status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      line-height: 1.5;
      background: #f3f4f6;
    }

    .success {
      background: #dcfce7 !important;
      color: #166534;
    }

    .error {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .info {
      background: #dbeafe !important;
      color: #1e40af;
    }

    .warning {
      background: #fef3c7 !important;
      color: #92400e;
    }

    .ticket {
      margin-top: 12px;
      padding: 14px;
      background: rgba(255,255,255,.7);
      border-radius: 10px;
      text-align: left;
    }

    .row {
      margin: 6px 0;
    }

    .label {
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Scanner Check-In Misa</h2>

  <label for="petugas">
    Nama Petugas
  </label>

  <input
    id="petugas"
    type="text"
    placeholder="Masukkan nama petugas"
    autocomplete="off"
  >

  <button
    id="btnStart"
    type="button"
    onclick="mulaiScanner()"
  >
    Mulai Scanner
  </button>

  <button
    id="btnStop"
    type="button"
    onclick="stopScanner()"
    class="hidden"
  >
    Hentikan Scanner
  </button>

  <div id="reader"></div>

  <div id="status">
    Scanner belum dimulai.
  </div>

</div>


<script>

/* =========================================================
   KONFIGURASI
========================================================= */

const API =
  "https://script.google.com/macros/s/AKfycbz53X4twAvOSWR8b5LuZW_Ven6SeNaPasnYMdAXr9qX6nkgNwl_2UlNoL_bS0VWfyzFGw/exec";


/* =========================================================
   VARIABEL
========================================================= */

let scanner = null;

let scannerAktif = false;

let sedangProses = false;

let bridgeFrame = null;

let bridgeTimeout = null;

let bridgeNonce = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  pesan,
  tipe
) {

  const el =
    document.getElementById("status");

  el.className = "";

  if (tipe) {
    el.classList.add(tipe);
  }

  el.innerHTML = pesan;

}


/* =========================================================
   MULAI SCANNER
========================================================= */

async function mulaiScanner() {

  if (scannerAktif) {
    return;
  }


  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  if (!petugas) {

    setStatus(
      "<b>Nama petugas wajib diisi.</b>",
      "error"
    );

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      "<b>Browser tidak mendukung kamera.</b>",
      "error"
    );

    return;
  }


  setStatus(
    "Meminta izin kamera...",
    "info"
  );


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });


    stream
      .getTracks()
      .forEach(function(track) {
        track.stop();
      });


    scanner =
      new Html5Qrcode("reader");


    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const ukuran =
            Math.min(
              width,
              height
            ) * 0.70;

          return {
            width: ukuran,
            height: ukuran
          };

        },

        aspectRatio: 1.0

      },

      qrBerhasil,

      function(errorMessage) {
        /*
          Error pembacaan frame
          tidak perlu ditampilkan.
        */
      }

    );


    scannerAktif = true;


    document
      .getElementById("btnStart")
      .classList.add("hidden");


    document
      .getElementById("btnStop")
      .classList.remove("hidden");


    setStatus(
      "<b>Scanner aktif.</b><br>" +
      "Arahkan kamera ke QR tiket.",
      "success"
    );

  }

  catch (error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    setStatus(
      "<b>Kamera tidak dapat dibuka.</b><br>" +
      "Pastikan izin kamera diberikan.",
      "error"
    );

  }

}


/* =========================================================
   QR BERHASIL TERBACA
========================================================= */

function qrBerhasil(
  decodedText
) {

  if (sedangProses) {
    return;
  }


  const idRegistrasi =
    String(
      decodedText || ""
    ).trim();


  if (!idRegistrasi) {
    return;
  }


  const petugas =
    document
      .getElementById("petugas")
      .value
      .trim();


  if (!petugas) {

    setStatus(
      "<b>Nama petugas belum diisi.</b>",
      "error"
    );

    return;
  }


  sedangProses = true;


  setStatus(
    "<b>QR TERBACA</b><br>" +
    "Memeriksa tiket...",
    "info"
  );


  kirimKeBridge(
    idRegistrasi,
    petugas
  );

}


/* =========================================================
   KIRIM KE BRIDGE
========================================================= */

function kirimKeBridge(
  idRegistrasi,
  petugas
) {

  bersihkanBridge();


  bridgeNonce =
    Date.now().toString() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2);


  const targetOrigin =
    window.location.origin;


  const bridgeUrl =
    API +
    "?page=bridge" +
    "&id=" +
    encodeURIComponent(
      idRegistrasi
    ) +
    "&petugas=" +
    encodeURIComponent(
      petugas
    ) +
    "&target=" +
    encodeURIComponent(
      targetOrigin
    ) +
    "&nonce=" +
    encodeURIComponent(
      bridgeNonce
    );


  console.log(
    "BRIDGE URL:",
    bridgeUrl
  );


  bridgeFrame =
    document.createElement("iframe");


  bridgeFrame.style.position =
    "fixed";

  bridgeFrame.style.left =
    "-10000px";

  bridgeFrame.style.top =
    "-10000px";

  bridgeFrame.style.width =
    "1px";

  bridgeFrame.style.height =
    "1px";

  bridgeFrame.style.border =
    "0";

  bridgeFrame.style.opacity =
    "0";

  bridgeFrame.style.pointerEvents =
    "none";


  bridgeFrame.src =
    bridgeUrl;


  document.body.appendChild(
    bridgeFrame
  );


  bridgeTimeout =
    setTimeout(
      function() {

        console.error(
          "BRIDGE TIMEOUT"
        );


        bersihkanBridge();


        sedangProses = false;


        setStatus(
          "<b>SERVER TIDAK MERESPONS</b><br>" +
          "Tidak menerima jawaban dari server Check-In.<br>" +
          "Coba scan kembali.",
          "error"
        );

      },
      20000
    );

}


/* =========================================================
   TERIMA POSTMESSAGE DARI BRIDGE
========================================================= */

function terimaPesan(
  event
) {

  console.log(
    "MESSAGE DITERIMA:",
    event
  );


  const data =
    event.data;


  if (!data) {
    return;
  }


  if (
    data.type !==
    "MISA_CHECKIN_RESULT"
  ) {

    return;
  }


  if (
    !bridgeNonce ||
    data.nonce !== bridgeNonce
  ) {

    console.warn(
      "Nonce tidak cocok."
    );

    return;
  }


  if (
    !bridgeFrame ||
    event.source !==
      bridgeFrame.contentWindow
  ) {

    console.warn(
      "Pesan bukan dari Bridge."
    );

    return;
  }


  console.log(
    "HASIL CHECK-IN:",
    data.data
  );


  if (bridgeTimeout) {

    clearTimeout(
      bridgeTimeout
    );

    bridgeTimeout = null;

  }


  bersihkanBridge();


  tampilkanHasil(
    data.data
  );

}


/* =========================================================
   TAMPILKAN HASIL
========================================================= */

function tampilkanHasil(
  hasil
) {

  if (!hasil) {

    setStatus(
      "<b>RESPON SERVER KOSONG.</b>",
      "error"
    );

    sedangProses = false;

    return;
  }


  if (hasil.success) {

    let html =
      "<b>CHECK-IN BERHASIL</b>";


    html +=
      "<div class='ticket'>";


    if (hasil.nama) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Nama:</span> " +
        escapeHtml(
          hasil.nama
        ) +
        "</div>";

    }


    if (hasil.namaMisa) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Misa:</span> " +
        escapeHtml(
          hasil.namaMisa
        ) +
        "</div>";

    }


    if (hasil.tanggal) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Tanggal:</span> " +
        escapeHtml(
          hasil.tanggal
        ) +
        "</div>";

    }


    if (hasil.jam) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Jam:</span> " +
        escapeHtml(
          hasil.jam
        ) +
        "</div>";

    }


    if (
      hasil.jumlah !==
      undefined
    ) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Jumlah:</span> " +
        escapeHtml(
          String(
            hasil.jumlah
          )
        ) +
        "</div>";

    }


    if (hasil.waktuCheckIn) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Waktu:</span> " +
        escapeHtml(
          hasil.waktuCheckIn
        ) +
        "</div>";

    }


    html +=
      "</div>";


    setStatus(
      html,
      "success"
    );

  }


  else if (
    hasil.alreadyCheckedIn
  ) {

    let html =
      "<b>TIKET SUDAH CHECK-IN</b>";


    html +=
      "<div class='ticket'>";


    if (hasil.nama) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Nama:</span> " +
        escapeHtml(
          hasil.nama
        ) +
        "</div>";

    }


    if (hasil.namaMisa) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Misa:</span> " +
        escapeHtml(
          hasil.namaMisa
        ) +
        "</div>";

    }


    if (hasil.waktuCheckIn) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Check-In:</span> " +
        escapeHtml(
          hasil.waktuCheckIn
        ) +
        "</div>";

    }


    if (hasil.petugasSebelumnya) {

      html +=
        "<div class='row'>" +
        "<span class='label'>Petugas:</span> " +
        escapeHtml(
          hasil.petugasSebelumnya
        ) +
        "</div>";

    }


    html +=
      "</div>";


    setStatus(
      html,
      "warning"
    );

  }


  else {

    setStatus(
      "<b>CHECK-IN DITOLAK</b><br><br>" +
      escapeHtml(
        hasil.message ||
        "Tiket tidak dapat diproses."
      ),
      "error"
    );

  }


  setTimeout(
    function() {

      sedangProses = false;

    },
    1500
  );

}


/* =========================================================
   BERSIHKAN BRIDGE
========================================================= */

function bersihkanBridge() {

  if (bridgeTimeout) {

    clearTimeout(
      bridgeTimeout
    );

    bridgeTimeout = null;

  }


  if (bridgeFrame) {

    try {
      bridgeFrame.remove();
    }
    catch (error) {
      console.error(error);
    }

    bridgeFrame = null;

  }


  bridgeNonce = null;

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerAktif
    ) {

      await scanner.stop();

      scanner.clear();

    }

  }
  catch (error) {

    console.error(
      "STOP ERROR:",
      error
    );

  }


  scanner = null;

  scannerAktif = false;

  sedangProses = false;


  bersihkanBridge();


  document
    .getElementById("btnStart")
    .classList.remove("hidden");


  document
    .getElementById("btnStop")
    .classList.add("hidden");


  setStatus(
    "Scanner dihentikan.",
    "info"
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   LISTENER
========================================================= */

window.addEventListener(
  "message",
  terimaPesan,
  false
);


/* =========================================================
   BERSIHKAN SAAT HALAMAN DITUTUP
========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    bersihkanBridge();

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#17365d">
  <title>Scanner QR Check-In Misa</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f8;color:#202124;font-family:Arial,sans-serif}
    .wrap{max-width:520px;margin:auto;padding:18px 14px 32px}
    .head{background:#17365d;color:#fff;border-radius:18px;padding:20px;text-align:center}
    .head h1{margin:0 0 6px;font-size:24px}
    .head p{margin:0;font-size:14px;opacity:.9}
    .card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 3px 12px rgba(0,0,0,.08)}
    #reader{width:100%;overflow:hidden;border-radius:14px;background:#111}
    .msg{margin-top:12px;padding:12px;border-radius:12px;line-height:1.45;font-size:14px}
    .info{background:#e8f1fb;color:#17365d}
    .error{background:#ffebee;color:#b71c1c}
    .ok{background:#e8f5e9;color:#1b5e20}
    button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;margin-top:12px;background:#17365d;color:#fff}
    .small{font-size:12px;color:#666;line-height:1.45;margin-top:10px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>📷 Scanner Check-In</h1>
    <p>Gereja Paroki • QR Ticket Misa</p>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div id="msg" class="msg info">Memulai kamera...</div>
    <button type="button" onclick="tutupScanner()">✕ Tutup Scanner</button>
    <div class="small">
      Arahkan kamera belakang ke QR Code pada tiket. Setelah QR terbaca,
      hasilnya dikirim kembali ke halaman Check-In.
    </div>
  </div>
</div>

<script>
  let scanner = null;
  let active = false;
  let sent = false;

  function setMsg(text, cls) {
    const el = document.getElementById('msg');
    el.className = 'msg ' + (cls || 'info');
    el.textContent = text;
  }

  function kirimKeInduk(idRegistrasi) {
    if (sent) return;
    sent = true;

    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(
          {
            type: 'MISA_CHECKIN_QR',
            idRegistrasi: String(idRegistrasi || '').trim()
          },
          '*'
        );
        setMsg('QR terbaca. Mengirim tiket ke halaman Check-In...', 'ok');
        setTimeout(() => {
          try { window.close(); } catch(e) {}
        }, 500);
      } else {
        setMsg('Halaman Check-In utama tidak ditemukan. Tutup scanner dan buka scanner dari halaman Check-In.', 'error');
        sent = false;
      }
    } catch (e) {
      console.error(e);
      setMsg('Gagal mengirim hasil scan ke halaman Check-In.', 'error');
      sent = false;
    }
  }

  async function mulai() {
    if (typeof Html5Qrcode === 'undefined') {
      setMsg('Library QR scanner gagal dimuat. Periksa koneksi internet lalu refresh.', 'error');
      return;
    }

    try {
      scanner = new Html5Qrcode('reader');

      await scanner.start(
        { facingMode: { ideal: 'environment' } },
        {
          fps: 10,
          qrbox: function(w, h) {
            const s = Math.floor(Math.min(w, h) * 0.72);
            return { width: s, height: s };
          },
          aspectRatio: 1
        },
        function(decodedText) {
          if (sent) return;

          const id = String(decodedText || '').trim();
          if (!id) return;

          setMsg('QR terbaca: ' + id + '. Memproses...', 'ok');
          sent = true;

          scanner.stop()
            .catch(() => {})
            .finally(() => {
              if (window.opener && !window.opener.closed) {
                window.opener.postMessage(
                  {
                    type: 'MISA_CHECKIN_QR',
                    idRegistrasi: id
                  },
                  '*'
                );
              } else {
                setMsg('Halaman Check-In utama tidak ditemukan.', 'error');
                sent = false;
              }
            });
        },
        function() {
          // Frame tanpa QR diabaikan.
        }
      );

      active = true;
      setMsg('Kamera aktif. Arahkan ke QR Code tiket.', 'info');
    } catch (err) {
      console.error(err);

      let text = 'Kamera tidak dapat dibuka.';
      if (err && err.name === 'NotAllowedError') {
        text = 'Akses kamera ditolak. Izinkan kamera untuk situs scanner ini.';
      } else if (err && err.name === 'NotFoundError') {
        text = 'Kamera tidak ditemukan pada perangkat.';
      } else if (err && err.name === 'NotReadableError') {
        text = 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi tersebut lalu coba lagi.';
      }

      setMsg(text, 'error');
    }
  }

  async function tutupScanner() {
    try {
      if (scanner && active) await scanner.stop();
    } catch(e) {}
    try {
      if (scanner) scanner.clear();
    } catch(e) {}
    active = false;

    try { window.close(); } catch(e) {}
  }

  window.addEventListener('load', mulai);
</script>
</body>
</html>
